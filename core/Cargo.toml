[package]
name = "core"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Main server for ethpayserver - unified API and service orchestration"
license = "MIT"

[[bin]]
name = "ethpayserver"
path = "src/main.rs"

[dependencies]
# Internal crates
auth = { git = "ssh://git@gitlab.com/random.cash/payserver-commons.git" }
crypto = { git = "ssh://git@gitlab.com/random.cash/payserver-commons.git" }
data-service = { path = "../data-service" }
evm = { path = "../evm", features = ["api", "redis"] }
types = { git = "ssh://git@gitlab.com/random.cash/payserver-commons.git", features = ["openapi"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
dotenvy = "0.15"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.42", features = ["test-util"] }
