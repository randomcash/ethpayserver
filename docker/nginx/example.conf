# Example nginx reverse proxy for ethpayserver
#
# Copy this file to /etc/nginx/sites-available/<your-domain> and adjust
# server_name and proxy_pass to match your setup.
#
# After placing, enable and get SSL:
#   ln -s /etc/nginx/sites-available/<your-domain> /etc/nginx/sites-enabled/
#   certbot --nginx -d <your-domain>
#   nginx -s reload

server {
    listen 80;
    server_name your-domain.example.com;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 240;
        proxy_send_timeout 240;
        proxy_read_timeout 240;
    }
}
