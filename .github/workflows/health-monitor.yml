name: Health monitor (deep)

# /api/health/deep can answer 200 while the money path is dead: evmmonitor
# stalls, monitor.data_fresh goes false, and every HTTP-status-only check
# stays green while invoices go unpaid. Nothing polled that field between
# deploys — health-gate.sh only runs when something deploys, and the daily
# e2e run is the only thing that touches testnet the rest of the time.
#
# This runs on GitHub-hosted runners on purpose, same reasoning as
# e2e-scheduled.yml: the deploy host cannot be trusted to report on itself
# being down.
#
# Every 5 minutes is the shortest interval GitHub Actions schedules
# meaningfully — not the 30-60s a real uptime checker gives you. This is the
# fallback documented in docs/ops.md: it exists to assert on the response
# body (monitor.data_fresh, per-chain rpc status), which a status-code-only
# uptime check cannot do. Configure a real Sentry Uptime Check against the
# same URL for the faster cadence; keep this running regardless, since it is
# the thing actually reading the body.
#
# A chain can report rpcs.*.status "ok" while its indexer has stopped
# advancing — status alone misses that. The actions/cache steps below persist
# each chain's last_block across runs so check-health-deep.sh can catch a
# block count that has gone flat, not just a chain that has gone unhealthy.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testnet:
    name: Deep health (testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Each run is a fresh runner, so last_block from the previous check has
      # to come from somewhere else. This cache entry is that "somewhere
      # else" — restored before the check, saved back after regardless of
      # outcome, keyed per-run so the save is never a no-op cache hit.
      - name: Restore health state
        uses: actions/cache/restore@v4
        with:
          path: .health-state
          key: health-state-testnet-${{ github.run_id }}
          restore-keys: |
            health-state-testnet-
      - name: Check /api/health/deep
        env:
          HEALTH_URL: https://testnet.random.cash/api/health/deep
          SENTRY_CRON_URL: ${{ secrets.SENTRY_CRON_HEALTH_TESTNET_URL }}
          HEALTH_STATE_FILE: .health-state/testnet.json
        run: scripts/check-health-deep.sh
      - name: Save health state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .health-state
          key: health-state-testnet-${{ github.run_id }}

  mainnet:
    name: Deep health (mainnet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore health state
        uses: actions/cache/restore@v4
        with:
          path: .health-state
          key: health-state-mainnet-${{ github.run_id }}
          restore-keys: |
            health-state-mainnet-
      - name: Check /api/health/deep
        env:
          HEALTH_URL: https://pay.random.cash/api/health/deep
          SENTRY_CRON_URL: ${{ secrets.SENTRY_CRON_HEALTH_MAINNET_URL }}
          HEALTH_STATE_FILE: .health-state/mainnet.json
        run: scripts/check-health-deep.sh
      - name: Save health state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .health-state
          key: health-state-mainnet-${{ github.run_id }}
