name: CI

on:
  pull_request:
  push:
    branches: [main, testnet]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Clone payserver-commons (sibling)
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          cd ..
          git clone --depth 1 -b "$BRANCH" https://github.com/randomcash/payserver-commons.git 2>/dev/null \
            || git clone --depth 1 https://github.com/randomcash/payserver-commons.git
          echo "Cloned payserver-commons"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install mold linker
        run: |
          # apt on hosted runners hangs often enough to matter: a stuck
          # `apt-get update` held the pipeline for 30+ minutes against a
          # 3-hour job timeout. Bound each attempt and retry.
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get update \
              && timeout 180 sudo apt-get install -y mold \
              && break
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 15
            if [ "$attempt" = 3 ]; then echo "::error::apt failed 3 times"; exit 1; fi
          done

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ethpayserver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Clone payserver-commons (sibling)
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          cd ..
          git clone --depth 1 -b "$BRANCH" https://github.com/randomcash/payserver-commons.git 2>/dev/null \
            || git clone --depth 1 https://github.com/randomcash/payserver-commons.git

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install mold + nextest
        run: |
          # apt on hosted runners hangs often enough to matter: a stuck
          # `apt-get update` held the pipeline for 30+ minutes against a
          # 3-hour job timeout. Bound each attempt and retry.
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get update \
              && timeout 180 sudo apt-get install -y mold \
              && break
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 15
            if [ "$attempt" = 3 ]; then echo "::error::apt failed 3 times"; exit 1; fi
          done
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Unit tests
        run: cargo nextest run --workspace --lib --no-fail-fast -j 2

      - name: Integration tests
        # Gating (RCS-186). These were non-blocking and 18 of 27 had been failing
        # unnoticed on an FK the fixtures never satisfied, so CI reported green
        # over dead multi-chain and fractional-amount aggregation coverage.
        run: |
          DATABASE_URL="postgres://test:test@127.0.0.1:5432/ethpayserver_test" \
            cargo run --release --bin migrate_postgres
          DATABASE_URL="postgres://test:test@127.0.0.1:5432/ethpayserver_test" \
            cargo nextest run -p data-service --no-fail-fast --run-ignored only -j 1

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet' || startsWith(github.ref, 'refs/tags/v')
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Clone payserver-commons (sibling)
        run: |
          BRANCH="${{ github.ref_name }}"
          cd ..
          git clone --depth 1 -b "$BRANCH" https://github.com/randomcash/payserver-commons.git 2>/dev/null \
            || git clone --depth 1 https://github.com/randomcash/payserver-commons.git

      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check licenses sources

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint, audit]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Clone payserver-commons (sibling)
        run: |
          BRANCH="${{ github.ref_name }}"
          cd ..
          git clone --depth 1 -b "$BRANCH" https://github.com/randomcash/payserver-commons.git 2>/dev/null \
            || git clone --depth 1 https://github.com/randomcash/payserver-commons.git

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-release

      - name: Install mold + trunk
        run: |
          # apt on hosted runners hangs often enough to matter: a stuck
          # `apt-get update` held the pipeline for 30+ minutes against a
          # 3-hour job timeout. Bound each attempt and retry.
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get update \
              && timeout 180 sudo apt-get install -y mold \
              && break
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 15
            if [ "$attempt" = 3 ]; then echo "::error::apt failed 3 times"; exit 1; fi
          done
          cargo install trunk --locked

      - name: Build server
        run: |
          cargo build --release --bin ethpayserver
          cargo build --release --bin migrate_postgres

      - name: Build monitor
        run: cargo build --release --bin evmmonitor --features monitor-bin

      - name: Build client
        run: cd client && trunk build --release
        env:
          RUSTFLAGS: ""

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            target/release/ethpayserver
            target/release/migrate_postgres
            target/release/evmmonitor
            client/dist/
          retention-days: 1

  # NOT gating yet — see RCS-192. This job carried `continue-on-error: true` for
  # its whole life, so it could never report a regression, and under that cover
  # the suite rotted: with the proxy and reset defects here fixed it goes from
  # 7/62 to 34/62 passing, and the remaining failures are selector drift against
  # a UI that moved on (one of them is the open bug RCS-172). Dropping the flag
  # today would only turn a silent red into a permanent red on every `testnet`
  # push. RCS-192 repairs the rest and removes the flag in the same commit, so
  # the flag disappears exactly when the suite can hold the line.
  #
  # The synthetic payment spec stays out of this job regardless: it needs a
  # funded wallet and a live chain, so it only runs where
  # `E2E_SYNTHETIC_PAYMENT=true` is set (see e2e-scheduled.yml).
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet' || startsWith(github.ref, 'refs/tags/v')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ethpayserver_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Make binaries executable
        run: chmod +x target/release/ethpayserver target/release/migrate_postgres

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run migrations
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/ethpayserver_e2e
        run: ./target/release/migrate_postgres

      - name: Start server
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/ethpayserver_e2e
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          ./target/release/ethpayserver &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/health/live && break || sleep 1; done

      # `npx serve` has no API proxy, so every /api call fell through to the SPA
      # fallback and the client parsed index.html as JSON ("Parse error: expected
      # value at line 1 column 1"). That failed all 30 authenticated tests and was
      # invisible while this job carried continue-on-error. Reuse the deployed
      # client's own nginx config so CI exercises the production routing rules;
      # only the upstream address and listen port are rewritten.
      - name: Serve frontend
        run: |
          sed -e 's|http://server:3000|http://127.0.0.1:3000|g' \
              -e 's|listen 80;|listen 8080;|' \
              docker/client-nginx.conf > /tmp/ci-client-nginx.conf
          docker run -d --name e2e-frontend --network host \
            -v "$PWD/client/dist:/usr/share/nginx/html:ro" \
            -v /tmp/ci-client-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/health/live \
            || { echo "::error::frontend proxy is not reaching the API"; docker logs e2e-frontend; exit 1; }

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_API_URL: http://127.0.0.1:3000
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_DATABASE_URL: postgres://test:test@127.0.0.1:5432/ethpayserver_e2e
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
    continue-on-error: true # removed by RCS-192, once the suite is green

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push server
        run: |
          docker build -f docker/ethpayserver.Dockerfile \
            -t ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.tag }} .
          docker push ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.tag }}

      - name: Build & push monitor
        run: |
          docker build -f docker/evmmonitor.Dockerfile \
            -t ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.tag }} .
          docker push ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.tag }}

      - name: Build & push client
        run: |
          docker build -f docker/client.Dockerfile \
            -t ${{ env.IMAGE_BASE }}/client:${{ steps.tag.outputs.tag }} .
          docker push ${{ env.IMAGE_BASE }}/client:${{ steps.tag.outputs.tag }}

  # staging (main) + production (tags) deploy via SSH push — see central-infrastructure/deploy.yml
  notify-deploy:
    name: Notify Deploy (staging / production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Resolve environment + tag
        id: resolve
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            # release tag -> production, deploy the exact version
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            # main -> staging
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "tag=main-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger central-infrastructure deploy
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DEPLOY_PAT" \
            https://api.github.com/repos/randomcash/central-infrastructure/dispatches \
            -d '{"event_type": "deploy", "client_payload": {"service": "ethpayserver", "environment": "${{ steps.resolve.outputs.environment }}", "sha": "${{ github.sha }}", "tag": "${{ steps.resolve.outputs.tag }}"}}'

  # testnet deploys via a self-hosted runner on debianbase (tailnet-only, no inbound) —
  # reverse/pull CD: the runner is already on the box and runs docker compose locally.
  deploy-testnet:
    name: Deploy testnet (self-hosted · debianbase)
    runs-on: [self-hosted, debianbase]
    timeout-minutes: 20
    needs: [docker]
    if: github.ref == 'refs/heads/testnet'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy via local docker compose
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          cd ~/deploy/ethpayserver/testnet
          export SERVER_IMAGE=ghcr.io/randomcash/ethpayserver:testnet-latest
          export CLIENT_IMAGE=ghcr.io/randomcash/ethpayserver/client:testnet-latest
          export MONITOR_IMAGE=ghcr.io/randomcash/ethpayserver/evmmonitor:testnet-latest
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          docker compose ps
          docker logout ghcr.io || true

      - name: Verify deploy is actually configured (RCS-187)
        run: |
          set -e
          # `docker compose up` succeeding proves the containers started, not
          # that they were configured. When the deploy user cannot read .env,
          # compose substitutes every variable as empty and the stack comes up
          # healthy-looking with no RPC endpoints at all — a green deploy with
          # dead payment monitoring. Assert the things that were silently wrong.

          echo "::group::server /health"
          for i in $(seq 1 30); do
            body=$(curl -sf --max-time 5 http://127.0.0.1:3100/health) && break || sleep 5
          done
          [ -n "${body:-}" ] || { echo "::error::server /health never responded"; exit 1; }
          echo "$body"
          echo "$body" | grep -q '"database":true' || { echo "::error::database not connected"; exit 1; }
          echo "$body" | grep -q '"redis":true'    || { echo "::error::redis not connected"; exit 1; }
          echo "::endgroup::"

          echo "::group::chain monitors"
          # evmmonitor republishes health on a timer; give it a few cycles.
          for i in $(seq 1 24); do
            health=$(docker exec ethpayserver_testnet_redis redis-cli --raw get evmmonitor:health 2>/dev/null || true)
            [ -n "$health" ] && [ "$health" != "[]" ] && break
            sleep 5
          done
          echo "${health:-<empty>}"
          python3 - "$health" <<'PY'
          import json, sys

          raw = sys.argv[1] if len(sys.argv) > 1 else ""
          if not raw.strip() or raw.strip() == "[]":
              print("::error::evmmonitor published no chain health — every RPC endpoint is "
                    "probably empty (is .env readable by the deploy user?)")
              sys.exit(1)

          chains = json.loads(raw)
          bad = [c for c in chains if c.get("status") != "connected" or not c.get("is_healthy")]
          for c in chains:
              print(f"  {c['chain_name']:18} {c['status']:12} healthy={c['is_healthy']} "
                    f"block={c.get('current_block')}")
          if bad:
              names = ", ".join(c["chain_name"] for c in bad)
              print(f"::error::chain monitors not connected: {names}")
              sys.exit(1)
          print(f"all {len(chains)} chain monitors connected")
          PY
          echo "::endgroup::"
