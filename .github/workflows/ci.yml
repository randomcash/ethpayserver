name: CI

on:
  pull_request:
  push:
    branches: [main, testnet]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4


      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install mold linker
        run: |
          # apt on hosted runners hangs often enough to matter: a stuck
          # `apt-get update` held the pipeline for 30+ minutes against a
          # 3-hour job timeout. Bound each attempt and retry.
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get update \
              && timeout 180 sudo apt-get install -y mold \
              && break
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 15
            if [ "$attempt" = 3 ]; then echo "::error::apt failed 3 times"; exit 1; fi
          done

      # A committed Cargo.lock that does not carry the pinned revision means
      # someone ran `scripts/commons.sh link` and committed the result. That
      # silently un-pins commons for everyone and restores exactly the
      # non-reproducible builds RCS-218 removed - and it looks like nothing.
      - name: Commons pin matches the lock file
        run: |
          REV="$(grep -m1 -oP 'rev = "\K[0-9a-f]{40}' Cargo.toml)"
          if [ -z "$REV" ]; then
            echo "::error::no payserver-commons rev pinned in Cargo.toml"
            exit 1
          fi
          # Per crate, and the crate name has to be in the match. Grepping only
          # for the revision proves that SOME entry is pinned, which a partial
          # un-pin passes: `types` pinned, `auth` left as a path entry, green.
          for CRATE in api-types types auth crypto rates scrub; do
            if ! awk -v c="$CRATE" -v r="$REV" '
                 /^\[\[package\]\]/ { name=""; src="" }
                 /^name = / { gsub(/[",]/,""); name=$3 }
                 /^source = / { src=$0 }
                 name == c && src ~ r { found=1 }
                 END { exit !found }' Cargo.lock; then
              echo "::error::Cargo.lock does not pin $CRATE at $REV."
              echo "Run 'scripts/commons.sh unlink' and commit the regenerated Cargo.lock."
              exit 1
            fi
          done
          echo "commons pinned at $REV in both Cargo.toml and Cargo.lock"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ethpayserver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4


      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install mold + nextest
        run: |
          # apt on hosted runners hangs often enough to matter: a stuck
          # `apt-get update` held the pipeline for 30+ minutes against a
          # 3-hour job timeout. Bound each attempt and retry.
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get update \
              && timeout 180 sudo apt-get install -y mold \
              && break
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 15
            if [ "$attempt" = 3 ]; then echo "::error::apt failed 3 times"; exit 1; fi
          done
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Unit tests
        run: cargo nextest run --workspace --lib --no-fail-fast -j 2

      - name: Integration tests
        # Gating (RCS-186). These were non-blocking and 18 of 27 had been failing
        # unnoticed on an FK the fixtures never satisfied, so CI reported green
        # over dead multi-chain and fractional-amount aggregation coverage.
        run: |
          DATABASE_URL="postgres://test:test@127.0.0.1:5432/ethpayserver_test" \
            cargo run --release --bin migrate_postgres
          DATABASE_URL="postgres://test:test@127.0.0.1:5432/ethpayserver_test" \
            cargo nextest run -p data-service --no-fail-fast --run-ignored only -j 1

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet' || startsWith(github.ref, 'refs/tags/v')
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4


      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check licenses sources

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint, audit]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4


      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-release

      - name: Install mold
        run: |
          # apt on hosted runners hangs often enough to matter: a stuck
          # `apt-get update` held the pipeline for 30+ minutes against a
          # 3-hour job timeout. Bound each attempt and retry.
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get update \
              && timeout 180 sudo apt-get install -y mold \
              && break
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 15
            if [ "$attempt" = 3 ]; then echo "::error::apt failed 3 times"; exit 1; fi
          done

      - name: Build server
        run: |
          cargo build --release --bin ethpayserver
          cargo build --release --bin migrate_postgres

      - name: Build monitor
        run: cargo build --release --bin evmmonitor --features monitor-bin

      # upload-artifact@v4 roots the archive at the least common ancestor of the
      # paths given. While `client/dist/` was in this list that ancestor was the
      # repo root, so the archive carried a `target/release/` prefix and both
      # consumers below unpacked into place. Dropping the client made
      # `target/release` itself the ancestor, the prefix vanished, and the
      # binaries landed loose in the workspace - which is why the download steps
      # now name an explicit destination. Do not remove those.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            target/release/ethpayserver
            target/release/migrate_postgres
            target/release/evmmonitor
          retention-days: 1

  # Gating as of RCS-192. This job carried `continue-on-error: true` for its
  # whole life, so it could never report a regression, and under that cover the
  # suite rotted: 7/62, then 34/62 once the proxy and reset defects were fixed.
  # The rest was read as selector drift against a UI that moved on. Most of it
  # was not: the job browsed 127.0.0.1 while the server's WebAuthn rp_origin is
  # http://localhost:8080, so every passkey registration failed that check and
  # every test needing a session timed out behind it (#78). It now runs 62
  # passed / 1 skipped in 2.1 minutes, against 30-minute cap timeouts before.
  #
  # Removing the flag blocks nothing: the deploy dispatch needs [docker], not
  # this job, and this job is skipped on pull_request (it is gated on
  # refs/heads/*), so a red E2E cannot hold up a deploy or a merge. What it does
  # is make a
  # regression show as a red run instead of a green one - which is the whole
  # point, and was impossible while the flag was set.
  #
  # The skip is the synthetic payment spec, which needs a funded wallet.
  #
  # The synthetic payment spec stays out of this job regardless: it needs a
  # funded wallet and a live chain, so it only runs where
  # `E2E_SYNTHETIC_PAYMENT=true` is set (see e2e-scheduled.yml).
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    # The frontend image comes from another repository, so this job pulls it
    # anonymously and that only works while the payserver-client package is
    # public. If it is ever made private, this pull fails with a denied
    # manifest rather than anything mentioning visibility - so: make it public,
    # or add a login here with a token that can read that package.
    permissions:
      contents: read
      packages: read
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet' || startsWith(github.ref, 'refs/tags/v')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ethpayserver_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          # The archive is rooted at target/release (see the upload step), so
          # unpack it back there rather than into the workspace root.
          path: target/release

      - name: Make binaries executable
        run: chmod +x target/release/ethpayserver target/release/migrate_postgres

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run migrations
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/ethpayserver_e2e
        run: ./target/release/migrate_postgres

      - name: Start server
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/ethpayserver_e2e
          REDIS_URL: redis://127.0.0.1:6379
          # The limiter is per IP, and the entire suite is one IP (127.0.0.1)
          # driven by a single worker. On the defaults - auth 5/min, write
          # 10/min, ws 5/min - the sixth registration of the run starts getting
          # 429s and every later spec fails on a fixture it never reaches. With
          # `retries: 1` each of those costs its timeout twice, which is how this
          # job spent 30 minutes and hit its own timeout on push after push.
          #
          # Raised, not disabled: the middleware still runs, so a change that
          # breaks it outright still shows up here. Its actual thresholds are
          # covered by unit tests in server/src/api/rate_limit.rs, which is the
          # right place for them - a shared-IP test suite is precisely the
          # traffic shape the production limits exist to stop.
          RATE_LIMIT_AUTH: "10000"
          RATE_LIMIT_WRITE: "10000"
          RATE_LIMIT_READ: "10000"
          RATE_LIMIT_WS: "10000"
        run: |
          ./target/release/ethpayserver &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/health/live && break || sleep 1; done

      # `npx serve` has no API proxy, so every /api call fell through to the SPA
      # fallback and the client parsed index.html as JSON ("Parse error: expected
      # value at line 1 column 1"). That failed all 30 authenticated tests and was
      # invisible while this job carried continue-on-error. So the frontend here
      # is the real published image, nginx config and all, and E2E exercises the
      # production routing rules rather than an approximation of them.
      #
      # It is the image this repo pins for testing (ops/client-image.pin). Note
      # that is no longer the same thing as the image that gets deployed: since
      # RCS-245 the frontend deploys on its own cadence from payserver-client,
      # so this pin says "the client we verified against", not "the client that
      # is live". Moving it is a deliberate act, which is the point.
      - name: Serve frontend
        run: |
          CLIENT_IMAGE="$(grep -v '^[[:space:]]*#' ops/client-image.pin | tr -d '[:space:]')"
          [ -n "$CLIENT_IMAGE" ] || { echo "::error::ops/client-image.pin is empty"; exit 1; }
          echo "frontend: $CLIENT_IMAGE"
          docker pull "$CLIENT_IMAGE"

          # Take the routing rules from the image rather than keeping a second
          # copy here: a stale copy would pass CI and then diverge from what is
          # actually served. Only the upstream address and listen port change.
          cid="$(docker create "$CLIENT_IMAGE")"
          docker cp "$cid:/etc/nginx/conf.d/default.conf" /tmp/ci-client-nginx.conf.orig
          docker rm -f "$cid" >/dev/null

          # Dual-stack on purpose. The suite browses http://localhost:8080 so
          # the WebAuthn origin matches the server's rp_origin, and `localhost`
          # can resolve to ::1 before 127.0.0.1; a v4-only listener turns that
          # into a connection refused.
          sed -e 's|http://server:3000|http://127.0.0.1:3000|g' \
              -e 's|listen 80;|listen 8080;\n    listen [::]:8080;|' \
              /tmp/ci-client-nginx.conf.orig > /tmp/ci-client-nginx.conf

          docker run -d --name e2e-frontend --network host \
            -v /tmp/ci-client-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            "$CLIENT_IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && break || sleep 1
          done
          curl -sf http://localhost:8080/api/health/live \
            || { echo "::error::frontend proxy is not reaching the API"; docker logs e2e-frontend; exit 1; }

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      # Steps print regardless of TTY; plain `list` only prints tests as they
      # FINISH, so a job killed at the 30-minute cap would name the last
      # completed test and never the one actually hanging.
      - name: Run E2E tests
        working-directory: e2e
        env:
          # localhost, NOT 127.0.0.1. The browser sends its own origin in the
          # WebAuthn ceremony and the server checks it against rp_origin, which
          # defaults to http://localhost:8080 (the CI log says so:
          # "WebAuthn configured rp_id=localhost rp_origin=http://localhost:8080").
          # Browsing 127.0.0.1 made every passkey registration fail that check.
          # Fixing it the other way round is not possible: an IP address is not
          # a valid RP ID, so the server cannot be pointed at 127.0.0.1 either.
          E2E_API_URL: http://localhost:3000
          E2E_BASE_URL: http://localhost:8080
          E2E_DATABASE_URL: postgres://test:test@127.0.0.1:5432/ethpayserver_e2e
          PLAYWRIGHT_LIST_PRINT_STEPS: "1"
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      # Keyless cosign: the job proves its identity with a GitHub OIDC token
      # instead of a long-lived private key. Nothing to store, nothing to rotate,
      # nothing to leak.
      id-token: write
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          # The archive is rooted at target/release (see the upload step), so
          # unpack it back there rather than into the workspace root.
          path: target/release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        # Pinned to a commit, not a tag. There is no floating `v4` tag - only
        # exact versions - and beyond that, an action that performs signing is
        # the last place to accept a mutable reference: whoever can move the tag
        # can change what signs our images.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Compute image tags
        id: tag
        run: |
          # Two tags per build (RCS-190). The moving one (testnet-latest) is
          # what humans pull; the per-commit one is never reused, so the
          # previous build keeps a name after the next push and rolling back
          # is a `compose up` instead of revert -> rebuild -> redeploy.
          # 7 chars matches `git rev-parse --short`, i.e. the build_sha the
          # server reports on /health — so a running container can be matched
          # to the image it came from.
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}-latest" >> "$GITHUB_OUTPUT"
          fi

      # Signed by DIGEST, never by tag. A tag is a moving pointer: signing
      # `:testnet-latest` says "something called that was signed once", which is
      # not a statement about the bytes anyone actually pulls. The digest is the
      # bytes. `cosign verify` on a tag resolves it to a digest and checks that,
      # so verifying by tag still works for humans.
      - name: Build & push server
        run: |
          docker build -f docker/ethpayserver.Dockerfile \
            -t ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.sha_tag }} .
          docker push ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.sha_tag }}
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.sha_tag }})"
          [ -n "$DIGEST" ] || { echo "::error::no digest for the server image"; exit 1; }
          cosign sign --yes "$DIGEST"
          echo "signed $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Build & push monitor
        run: |
          docker build -f docker/evmmonitor.Dockerfile \
            -t ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.tag }} \
            -t ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.sha_tag }} .
          docker push ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.tag }}
          docker push ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.sha_tag }}
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.sha_tag }})"
          [ -n "$DIGEST" ] || { echo "::error::no digest for the monitor image"; exit 1; }
          cosign sign --yes "$DIGEST"
          echo "signed $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # staging (main) + production (tags) deploy via SSH push — see central-infrastructure/deploy.yml
  # testnet deploys by dispatch like every other environment (RCS-246). It used
  # to run here, on a self-hosted runner attached to this PUBLIC repository -
  # which GitHub warns against, because a fork PR can execute on it. The only
  # thing standing between that and code execution on the box was one `if:`
  # line, and nobody would notice it going missing in a refactor. The job body
  # also described the deploy host in detail: compose layout, ports, health
  # probes, rollback.
  #
  # Separate from notify-deploy below because the payload differs: this targets
  # central-infrastructure's deploy-testnet.yml, which takes `sha_tag` and runs
  # docker compose locally on the box. The other targets deploy.yml, which takes
  # {service, environment, tag} and goes over SSH.
  notify-deploy-testnet:
    name: Notify Deploy (testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker]
    if: github.ref == 'refs/heads/testnet'
    steps:
      - name: Trigger central-infrastructure deploy
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          set -e
          [ -n "$DEPLOY_PAT" ] || { echo "::error::DEPLOY_PAT is not set; images were pushed but nothing will deploy"; exit 1; }
          SHA_TAG="${{ needs.docker.outputs.sha_tag }}"
          [ -n "$SHA_TAG" ] || { echo "::error::docker job produced no sha tag"; exit 1; }
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DEPLOY_PAT" \
            https://api.github.com/repos/randomcash/central-infrastructure/dispatches \
            -d "{\"event_type\":\"deploy-testnet\",\"client_payload\":{\"sha_tag\":\"$SHA_TAG\"}}"
          echo "dispatched deploy-testnet $SHA_TAG" >> "$GITHUB_STEP_SUMMARY"

  notify-deploy:
    name: Notify Deploy (staging / production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Resolve environment + tag
        id: resolve
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            # release tag -> production, deploy the exact version
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            # main -> staging
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "tag=main-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger central-infrastructure deploy
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DEPLOY_PAT" \
            https://api.github.com/repos/randomcash/central-infrastructure/dispatches \
            -d '{"event_type": "deploy", "client_payload": {"service": "ethpayserver", "environment": "${{ steps.resolve.outputs.environment }}", "sha": "${{ github.sha }}", "tag": "${{ steps.resolve.outputs.tag }}"}}'
