name: CI

on:
  pull_request:
  # A merge queue tests the *merged* result before it lands, which is the only
  # thing that catches a pull request that is green against a base it no longer
  # merges into. Required checks here are not strict, so a branch is never
  # re-tested against the base it actually joins: on 2026-09-15 a change adding
  # a parameter to `PgAppState::new` was green on its own branch while four
  # callsites merged in the meantime had not been updated, and two branches
  # picked the same migration version, each green alone.
  #
  # Without this trigger a queue would hang forever - Lint, Test and Audit are
  # required, and on a `refs/heads/gh-readonly-queue/...` ref they would never
  # be asked to run. The trigger is safe before the queue is switched on and
  # necessary before it is.
  merge_group:
  push:
    branches: [main, testnet]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the session-URL guard scans a commit range.
          fetch-depth: 0

      # This repository is public. A ticket id in a source file leaks the
      # title and shape of unreleased work, and an outside reader cannot open
      # the tracker anyway. Ticket ids belong in the commit message and PR
      # title, not the tree - see CLAUDE.md.
      - name: No ticket ids or tracker links in source
        run: ./scripts/check-no-ticket-refs.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install mold linker
        run: |
          # apt on hosted runners hangs often enough to matter: a stuck
          # `apt-get update` held the pipeline for 30+ minutes against a
          # 3-hour job timeout. Bound each attempt and retry.
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get update \
              && timeout 180 sudo apt-get install -y mold \
              && break
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 15
            if [ "$attempt" = 3 ]; then echo "::error::apt failed 3 times"; exit 1; fi
          done

      # A committed Cargo.lock that does not carry the pinned revision means
      # someone ran `scripts/commons.sh link` and committed the result. That
      # silently un-pins commons for everyone and restores exactly the
      # non-reproducible builds the pin removed - and it looks like nothing.
      - name: Commons pin matches the lock file
        run: |
          REV="$(grep -m1 -oP 'rev = "\K[0-9a-f]{40}' Cargo.toml)"
          if [ -z "$REV" ]; then
            echo "::error::no payserver-commons rev pinned in Cargo.toml"
            exit 1
          fi
          # Per crate, and the crate name has to be in the match. Grepping only
          # for the revision proves that SOME entry is pinned, which a partial
          # un-pin passes: `types` pinned, `auth` left as a path entry, green.
          for CRATE in api-types types auth crypto rates scrub; do
            if ! awk -v c="$CRATE" -v r="$REV" '
                 /^\[\[package\]\]/ { name=""; src="" }
                 /^name = / { gsub(/[",]/,""); name=$3 }
                 /^source = / { src=$0 }
                 name == c && src ~ r { found=1 }
                 END { exit !found }' Cargo.lock; then
              echo "::error::Cargo.lock does not pin $CRATE at $REV."
              echo "Run 'scripts/commons.sh unlink' and commit the regenerated Cargo.lock."
              exit 1
            fi
          done
          echo "commons pinned at $REV in both Cargo.toml and Cargo.lock"

      # Proves the guard below actually goes red and green on the cases it
      # claims to, against a real throwaway commons history built on the fly -
      # not a comment asserting someone ran it once by hand.
      - name: Commons pin guard self-test
        run: scripts/check-commons-pin.test.sh

      # A cross-repo ticket pins commons by the commons PR's branch sha before
      # that PR merges. Merge ethpayserver first (or just forget to re-pin)
      # and the workspace ends up pinned to a commit that only exists on the
      # commons branch - which a squash merge then deletes, taking the commit
      # with it. Nothing fails at merge time; the build stays green until the
      # next clean checkout tries to resolve the pin and finds nothing there.
      # Commons is public, so this needs no token.
      - name: Commons pin is on commons main
        run: scripts/check-commons-pin.sh

      # A collision here is not a naming nit: sqlx keys applied migrations by
      # the version in the filename, so the second file to claim a version is
      # refused on every startup from then on, not just the first. Two branches
      # opened the same afternoon can each be green alone and only collide once
      # both have merged - which is exactly what two branches did on 2026-09-15.
      # Commit messages, not just files. CLAUDE.md has forbidden session URLs
      # in commits since long before this check existed, and 58 commits carry
      # one anyway - the rule was written down and nothing read it. Needs the
      # full history, hence fetch-depth 0 on the checkout above.
      - name: No session URLs in commits or source
        env:
          BASE_REF: origin/${{ github.base_ref || 'testnet' }}
        run: |
          git fetch -q origin "${{ github.base_ref || 'testnet' }}" || true
          ./scripts/check-no-session-urls.sh

      - name: Session URL guard self-test
        run: ./scripts/check-no-session-urls.test.sh

      - name: Migration versions are distinct
        run: ./scripts/check-migrations.sh

      - name: Migration guard self-test
        run: ./scripts/check-migrations.test.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Non-blocking on purpose. ops/client-image.pin only has to be non-empty to
  # pass the rest of CI, so it can fall arbitrarily far behind
  # payserver-client's main without anything noticing - e2e keeps passing
  # because the old client still matches the old selectors, and whoever
  # eventually bumps the pin inherits every failure that drift was hiding. A
  # hard failure here would block unrelated PRs the moment the client moved,
  # which is how a check like that gets disabled; a warning keeps the drift
  # visible without holding anything up.
  client-pin-drift:
    name: Client pin drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check pin distance from payserver-client main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # This job's whole point is "warn, not fail" - every lookup below is
          # guarded by an emptiness check that falls back to a warning. Actions
          # runs steps under `bash -eo pipefail`, which would abort the script
          # on the first failed curl/jq/grep *before* that guard ever runs, so
          # turn both off and let the guards do the job they were written for.
          set +e +o pipefail

          CLIENT_REPO="randomcash/payserver-client"
          # Arbitrary but documented: past this many commits behind, e2e is
          # exercising a client build old enough that a shipped feature has no
          # coverage. Raise or lower it here if it fires too often or too
          # rarely.
          MAX_COMMITS_BEHIND=20

          CLIENT_IMAGE="$(grep -v '^[[:space:]]*#' ops/client-image.pin | tr -d '[:space:]')"
          if [ -z "$CLIENT_IMAGE" ]; then
            echo "::warning::ops/client-image.pin is empty, skipping drift check"
            exit 0
          fi

          PIN_SHA="${CLIENT_IMAGE##*:sha-}"
          if [ "$PIN_SHA" = "$CLIENT_IMAGE" ] || [ -z "$PIN_SHA" ]; then
            echo "::warning::ops/client-image.pin ($CLIENT_IMAGE) is not a sha-<commit> tag, cannot measure drift against $CLIENT_REPO main"
            exit 0
          fi

          # --max-time bounds a stalled/slow API call: without it, curl can hang
          # past this job's timeout-minutes and get killed as a failed step -
          # exactly the hard failure this check exists to avoid.
          api() { curl -sf --max-time 10 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${CLIENT_REPO}/$1"; }

          CURRENT_SHA="$(api branches/main | jq -r '.commit.sha // empty')"
          if [ -z "$CURRENT_SHA" ]; then
            echo "::warning::could not resolve $CLIENT_REPO main, skipping drift check"
            exit 0
          fi
          CURRENT_TAG="sha-${CURRENT_SHA:0:7}"

          AHEAD_BY="$(api "compare/${PIN_SHA}...${CURRENT_SHA}" | jq -r '.ahead_by // empty')"
          if [ -z "$AHEAD_BY" ]; then
            echo "::warning::could not compare ops/client-image.pin (sha-$PIN_SHA) against $CLIENT_REPO main, skipping drift check"
            exit 0
          fi

          echo "pinned:   sha-$PIN_SHA"
          echo "current:  $CURRENT_TAG"
          echo "distance: $AHEAD_BY commit(s) behind main"

          if [ "$AHEAD_BY" -gt "$MAX_COMMITS_BEHIND" ]; then
            echo "::warning::ops/client-image.pin is $AHEAD_BY commits behind payserver-client main (pinned sha-$PIN_SHA, current $CURRENT_TAG) - past $MAX_COMMITS_BEHIND, e2e may no longer exercise what the client actually ships. Bump it: sed -i '\$ s|.*|ghcr.io/randomcash/payserver-client:$CURRENT_TAG|' ops/client-image.pin"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ethpayserver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4


      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install mold + nextest
        run: |
          # apt on hosted runners hangs often enough to matter: a stuck
          # `apt-get update` held the pipeline for 30+ minutes against a
          # 3-hour job timeout. Bound each attempt and retry.
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get update \
              && timeout 180 sudo apt-get install -y mold \
              && break
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 15
            if [ "$attempt" = 3 ]; then echo "::error::apt failed 3 times"; exit 1; fi
          done
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Unit tests
        # Every test binary, not just `--lib`. The integration binaries -
        # evm/tests, server/tests - were compiled by clippy and never run, so
        # they could go red and stay red without anything noticing: on
        # 2026-09-16 three tests in evm/tests/payment_flow.rs and two in
        # server/tests/payment_flow.rs were failing on testnet while this job
        # reported green. `#[ignore]`d tests still need a database and are run
        # separately below.
        run: cargo nextest run --workspace --no-fail-fast -j 2

      - name: Integration tests
        # Gating. These were non-blocking and 18 of 27 had been failing
        # unnoticed on an FK the fixtures never satisfied, so CI reported green
        # over dead multi-chain and fractional-amount aggregation coverage.
        #
        # `-p server` covers the plugin-storage tests (schema
        # creation, migration runner, search_path scoping): they were
        # `#[ignore]`'d like the rest of this suite but, unlike data-service,
        # had no CI job ever passing `--run-ignored`, so nothing here actually
        # ran them.
        run: |
          DATABASE_URL="postgres://test:test@127.0.0.1:5432/ethpayserver_test" \
            cargo run --release --bin migrate_postgres
          DATABASE_URL="postgres://test:test@127.0.0.1:5432/ethpayserver_test" \
            cargo nextest run -p data-service -p server --no-fail-fast --run-ignored only -j 1

  # Runs on pull requests too, deliberately. This used to be branch-only, so a
  # dependency a PR introduced was invisible until after it merged - and then
  # it did not fail anything, it made the deploy jobs skip. That is exactly how
  # the plugin runtime's cranelift crates (Apache-2.0 WITH LLVM-exception,
  # which deny.toml did not allow) reached testnet on 2026-09-15 and stopped
  # deploys: every check on that PR was green, because the job that would have
  # objected could not run on a PR.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4


      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check licenses sources

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `test` included: without it a push whose tests fail still builds, pushes
    # an image and deploys. Tests gate merging a PR, but nothing gated the
    # branch itself.
    needs: [lint, audit, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4


      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-release

      - name: Install mold
        run: |
          # apt on hosted runners hangs often enough to matter: a stuck
          # `apt-get update` held the pipeline for 30+ minutes against a
          # 3-hour job timeout. Bound each attempt and retry.
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get update \
              && timeout 180 sudo apt-get install -y mold \
              && break
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 15
            if [ "$attempt" = 3 ]; then echo "::error::apt failed 3 times"; exit 1; fi
          done

      - name: Build server
        run: |
          cargo build --release --bin ethpayserver
          cargo build --release --bin migrate_postgres

      - name: Build monitor
        run: cargo build --release --bin evmmonitor --features monitor-bin

      # upload-artifact@v4 roots the archive at the least common ancestor of the
      # paths given. While `client/dist/` was in this list that ancestor was the
      # repo root, so the archive carried a `target/release/` prefix and both
      # consumers below unpacked into place. Dropping the client made
      # `target/release` itself the ancestor, the prefix vanished, and the
      # binaries landed loose in the workspace - which is why the download steps
      # now name an explicit destination. Do not remove those.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            target/release/ethpayserver
            target/release/migrate_postgres
            target/release/evmmonitor
          retention-days: 1

  # Gating. This job carried `continue-on-error: true` for its
  # whole life, so it could never report a regression, and under that cover the
  # suite rotted: 7/62, then 34/62 once the proxy and reset defects were fixed.
  # The rest was read as selector drift against a UI that moved on. Most of it
  # was not: the job browsed 127.0.0.1 while the server's WebAuthn rp_origin is
  # http://localhost:8080, so every passkey registration failed that check and
  # every test needing a session timed out behind it (#78). It now runs 62
  # passed / 1 skipped in 2.1 minutes, against 30-minute cap timeouts before.
  #
  # Removing the flag blocks nothing: the deploy dispatch needs [docker], not
  # this job, and this job is skipped on pull_request (it is gated on
  # refs/heads/*), so a red E2E cannot hold up a deploy or a merge. What it does
  # is make a regression show as a red run instead of a green one - which is
  # the whole point, and was impossible while the flag was set.
  #
  # The skip is the synthetic payment spec, which needs a funded wallet.
  #
  # The synthetic payment spec stays out of this job regardless: it needs a
  # funded wallet and a live chain, so it only runs where
  # `E2E_SYNTHETIC_PAYMENT=true` is set (see e2e-scheduled.yml).
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    # The frontend image comes from another repository, so this job pulls it
    # anonymously and that only works while the payserver-client package is
    # public. If it is ever made private, this pull fails with a denied
    # manifest rather than anything mentioning visibility - so: make it public,
    # or add a login here with a token that can read that package.
    permissions:
      contents: read
      packages: read
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet' || startsWith(github.ref, 'refs/tags/v')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ethpayserver_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          # The archive is rooted at target/release (see the upload step), so
          # unpack it back there rather than into the workspace root.
          path: target/release

      - name: Make binaries executable
        run: chmod +x target/release/ethpayserver target/release/migrate_postgres

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run migrations
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/ethpayserver_e2e
        run: ./target/release/migrate_postgres

      - name: Start server
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/ethpayserver_e2e
          REDIS_URL: redis://127.0.0.1:6379
          # The limiter is per IP, and the entire suite is one IP (127.0.0.1)
          # driven by a single worker. On the defaults - auth 5/min, write
          # 10/min, ws 5/min - the sixth registration of the run starts getting
          # 429s and every later spec fails on a fixture it never reaches. With
          # `retries: 1` each of those costs its timeout twice, which is how this
          # job spent 30 minutes and hit its own timeout on push after push.
          #
          # Raised, not disabled: the middleware still runs, so a change that
          # breaks it outright still shows up here. Its actual thresholds are
          # covered by unit tests in server/src/api/rate_limit.rs, which is the
          # right place for them - a shared-IP test suite is precisely the
          # traffic shape the production limits exist to stop.
          RATE_LIMIT_AUTH: "10000"
          RATE_LIMIT_WRITE: "10000"
          RATE_LIMIT_READ: "10000"
          RATE_LIMIT_WS: "10000"
          # Without this the server refuses to start outright. Error reporting
          # fails closed: no SENTRY_DSN plus an unset or unrecognised
          # SENTRY_ENVIRONMENT is a hard exit, so that a missing DSN can never
          # be mistaken for a working one. "dev" is one of the two values
          # permitted to run with reporting off, and is what this job wants -
          # a CI run has nowhere to report to and nothing worth reporting.
          #
          # That gate landed while this job was already red-by-default (see
          # the readiness check below), so it broke E2E on every testnet push
          # from the moment it merged and the job stayed green-looking for two
          # steps afterwards.
          SENTRY_ENVIRONMENT: dev
        # Fails here if the server does not come up, rather than letting a dead
        # server surface two steps later as "frontend proxy is not reaching the
        # API" - which reads as a client or nginx problem and is why this took
        # a while to find. The old loop was:
        #
        #   for i in $(seq 1 30); do curl -sf .../health/live && break || sleep 1; done
        #
        # whose last command on total failure is `sleep 1`, so the step exited
        # 0 having never reached the server once.
        run: |
          ./target/release/ethpayserver &
          server_pid=$!

          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health/live >/dev/null; then
              echo "server is up"
              exit 0
            fi
            # Distinguishes "still starting" from "exited": polling a process
            # that is already gone for the full 30s only delays the report and
            # loses the reason, which the server has already printed.
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::the server exited during startup - see the lines above for why"
              wait "$server_pid" || true
              exit 1
            fi
            sleep 1
          done

          echo "::error::the server did not answer /health/live within 30s"
          exit 1

      # `npx serve` has no API proxy, so every /api call fell through to the SPA
      # fallback and the client parsed index.html as JSON ("Parse error: expected
      # value at line 1 column 1"). That failed all 30 authenticated tests and was
      # invisible while this job carried continue-on-error. So the frontend here
      # is the real published image, nginx config and all, and E2E exercises the
      # production routing rules rather than an approximation of them.
      #
      # It is the image this repo pins for testing (ops/client-image.pin). Note
      # that is no longer the same thing as the image that gets deployed: the
      # frontend deploys on its own cadence from payserver-client,
      # so this pin says "the client we verified against", not "the client that
      # is live". Moving it is a deliberate act, which is the point.
      - name: Serve frontend
        run: |
          CLIENT_IMAGE="$(grep -v '^[[:space:]]*#' ops/client-image.pin | tr -d '[:space:]')"
          [ -n "$CLIENT_IMAGE" ] || { echo "::error::ops/client-image.pin is empty"; exit 1; }
          echo "frontend: $CLIENT_IMAGE"
          docker pull "$CLIENT_IMAGE"

          # Take the routing rules from the image rather than keeping a second
          # copy here: a stale copy would pass CI and then diverge from what is
          # actually served. Only the upstream address and listen port change.
          cid="$(docker create "$CLIENT_IMAGE")"
          docker cp "$cid:/etc/nginx/conf.d/default.conf" /tmp/ci-client-nginx.conf.orig
          docker rm -f "$cid" >/dev/null

          # Dual-stack on purpose. The suite browses http://localhost:8080 so
          # the WebAuthn origin matches the server's rp_origin, and `localhost`
          # can resolve to ::1 before 127.0.0.1; a v4-only listener turns that
          # into a connection refused.
          sed -e 's|http://server:3000|http://127.0.0.1:3000|g' \
              -e 's|listen 80;|listen 8080;\n    listen [::]:8080;|' \
              /tmp/ci-client-nginx.conf.orig > /tmp/ci-client-nginx.conf

          docker run -d --name e2e-frontend --network host \
            -v /tmp/ci-client-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            "$CLIENT_IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && break || sleep 1
          done
          curl -sf http://localhost:8080/api/health/live \
            || { echo "::error::frontend proxy is not reaching the API"; docker logs e2e-frontend; exit 1; }

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      # Steps print regardless of TTY; plain `list` only prints tests as they
      # FINISH, so a job killed at the 30-minute cap would name the last
      # completed test and never the one actually hanging.
      - name: Run E2E tests
        working-directory: e2e
        env:
          # localhost, NOT 127.0.0.1. The browser sends its own origin in the
          # WebAuthn ceremony and the server checks it against rp_origin, which
          # defaults to http://localhost:8080 (the CI log says so:
          # "WebAuthn configured rp_id=localhost rp_origin=http://localhost:8080").
          # Browsing 127.0.0.1 made every passkey registration fail that check.
          # Fixing it the other way round is not possible: an IP address is not
          # a valid RP ID, so the server cannot be pointed at 127.0.0.1 either.
          E2E_API_URL: http://localhost:3000
          E2E_BASE_URL: http://localhost:8080
          E2E_DATABASE_URL: postgres://test:test@127.0.0.1:5432/ethpayserver_e2e
          PLAYWRIGHT_LIST_PRINT_STEPS: "1"
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      # Keyless cosign: the job proves its identity with a GitHub OIDC token
      # instead of a long-lived private key. Nothing to store, nothing to rotate,
      # nothing to leak.
      id-token: write
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          # The archive is rooted at target/release (see the upload step), so
          # unpack it back there rather than into the workspace root.
          path: target/release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        # Pinned to a commit, not a tag. There is no floating `v4` tag - only
        # exact versions - and beyond that, an action that performs signing is
        # the last place to accept a mutable reference: whoever can move the tag
        # can change what signs our images.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Compute image tags
        id: tag
        run: |
          # Two tags per build. The moving one (testnet-latest) is
          # what humans pull; the per-commit one is never reused, so the
          # previous build keeps a name after the next push and rolling back
          # is a `compose up` instead of revert -> rebuild -> redeploy.
          # 7 chars matches `git rev-parse --short`, i.e. the build_sha the
          # server reports on /health — so a running container can be matched
          # to the image it came from.
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}-latest" >> "$GITHUB_OUTPUT"
          fi

      # Signed by DIGEST, never by tag. A tag is a moving pointer: signing
      # `:testnet-latest` says "something called that was signed once", which is
      # not a statement about the bytes anyone actually pulls. The digest is the
      # bytes. `cosign verify` on a tag resolves it to a digest and checks that,
      # so verifying by tag still works for humans.
      - name: Build & push server
        run: |
          docker build -f docker/ethpayserver.Dockerfile \
            -t ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.sha_tag }} .
          docker push ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.sha_tag }}
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.sha_tag }})"
          [ -n "$DIGEST" ] || { echo "::error::no digest for the server image"; exit 1; }
          cosign sign --yes "$DIGEST"
          echo "signed $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Build & push monitor
        run: |
          docker build -f docker/evmmonitor.Dockerfile \
            -t ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.tag }} \
            -t ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.sha_tag }} .
          docker push ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.tag }}
          docker push ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.sha_tag }}
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.sha_tag }})"
          [ -n "$DIGEST" ] || { echo "::error::no digest for the monitor image"; exit 1; }
          cosign sign --yes "$DIGEST"
          echo "signed $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # staging (main) + production (tags) deploy via SSH push — see central-infrastructure/deploy.yml
  # testnet deploys by dispatch like every other environment. It used
  # to run here, on a self-hosted runner attached to this PUBLIC repository -
  # which GitHub warns against, because a fork PR can execute on it. The only
  # thing standing between that and code execution on the box was one `if:`
  # line, and nobody would notice it going missing in a refactor. The job body
  # also described the deploy host in detail: compose layout, ports, health
  # probes, rollback.
  #
  # NOTE: removing the job does NOT deregister the runner. `debianbase` (id 22)
  # is still registered and online on this repository, so any workflow file
  # saying `runs-on: [self-hosted, debianbase]` still lands on the deploy box -
  # and now there is no `if:` guarding it, because nothing references it. This
  # change removes the only current use, not the exposure. Deregistering it
  # (and removing the runner service on the box) is the step that finishes the
  # job; until then, treat this as half done.
  #
  # Separate from notify-deploy below because the payload differs: this targets
  # central-infrastructure's deploy-testnet.yml, which takes `sha_tag` and runs
  # docker compose locally on the box. The other targets deploy.yml, which takes
  # {service, environment, tag} and goes over SSH.
  notify-deploy-testnet:
    name: Notify Deploy (testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker]
    if: github.ref == 'refs/heads/testnet'
    # Nothing here uses GITHUB_TOKEN - the dispatch authenticates with
    # DEPLOY_PAT, which is a different credential. Handing this job the
    # repository's default token scope while it holds a cross-repo PAT is
    # scope it has no use for.
    permissions: {}
    steps:
      - name: Trigger central-infrastructure deploy
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          set -e
          [ -n "$DEPLOY_PAT" ] || { echo "::error::DEPLOY_PAT is not set; images were pushed but nothing will deploy"; exit 1; }
          SHA_TAG="${{ needs.docker.outputs.sha_tag }}"
          [ -n "$SHA_TAG" ] || { echo "::error::docker job produced no sha tag"; exit 1; }
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DEPLOY_PAT" \
            https://api.github.com/repos/randomcash/central-infrastructure/dispatches \
            -d "{\"event_type\":\"deploy-testnet\",\"client_payload\":{\"sha_tag\":\"$SHA_TAG\"}}"
          echo "dispatched deploy-testnet $SHA_TAG" >> "$GITHUB_STEP_SUMMARY"

  # Mainnet handles real merchant funds, so it takes release tags and nothing
  # else. `staging` was dropped with the rename: no staging host exists, and the
  # `main` branch that fed it has been dormant since April while `testnet` is the
  # trunk - so the dispatch it sent could only ever have failed on a host with no
  # such directory.
  notify-deploy:
    name: Notify Deploy (mainnet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Resolve tag, and refuse anything that is not a release
        id: resolve
        run: |
          REF="${{ github.ref }}"

          # `refs/tags/v*` is not a release filter: it matches v1.0.0-beta.1 and
          # v1.0.0-rc1 exactly as readily as v1.0.0. The only tag this repo has
          # ever carried is v0.1.0-alpha, so under the old rule the single
          # existing tag was one push away from deploying to the environment
          # that holds real funds.
          #
          # A release is vMAJOR.MINOR.PATCH and nothing more. Hotfixes are
          # release tags too, so they pass; prereleases build and publish their
          # image but stop here.
          if [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "environment=mainnet" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.ref_name }} is a prerelease; image published, mainnet deploy skipped."
            echo "\`${{ github.ref_name }}\` is a prerelease - image published, mainnet deploy skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Trigger central-infrastructure deploy
        if: steps.resolve.outputs.deploy == 'true'
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          set -e
          # Same guards the testnet dispatch already carries: a missing token or
          # a silent HTTP failure must not read as a successful deploy.
          [ -n "$DEPLOY_PAT" ] || { echo "::error::DEPLOY_PAT is not set; images were pushed but nothing will deploy"; exit 1; }
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DEPLOY_PAT" \
            https://api.github.com/repos/randomcash/central-infrastructure/dispatches \
            -d '{"event_type": "deploy", "client_payload": {"service": "ethpayserver", "environment": "${{ steps.resolve.outputs.environment }}", "sha": "${{ github.sha }}", "tag": "${{ steps.resolve.outputs.tag }}"}}'
          echo "dispatched mainnet deploy ${{ steps.resolve.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

  # The dispatch above is fire-and-forget: a 202 from GitHub's API means the
  # event was accepted, not that anything deployed. `scripts/health-gate.sh`
  # was written for exactly this and documented in
  # docs/deployment/mainnet-gate.md as a `post-deploy:health-gate` job - but
  # that job description was GitLab CI and never came across, so the script has
  # been in the tree unreferenced. This is the reference.
  deploy-verify-testnet:
    name: Verify testnet deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [notify-deploy-testnet]
    if: github.ref == 'refs/heads/testnet'
    permissions: {}
    steps:
      - uses: actions/checkout@v4

      - name: Poll /health/deep until it reports this commit
        env:
          # The `/api` prefix is load-bearing. testnet.random.cash serves the
          # client, whose SPA fallback answers `/health/deep` with 200 and a
          # page of HTML - a gate pointed there would pass on a server that
          # never restarted. The API lives under `/api`.
          HEALTH_URL: https://testnet.random.cash/api/health/deep
          # Long enough for the dispatch to be picked up, the image pulled and
          # migrations to run. Short enough that a deploy which never lands is
          # reported on the same run that should have produced it.
          HEALTH_TIMEOUT: "600"
        run: |
          set -e
          export EXPECTED_SHA="${GITHUB_SHA::7}"
          echo "expecting build_sha=$EXPECTED_SHA at $HEALTH_URL"
          bash scripts/health-gate.sh

  # The one red X that names the deploy.
  #
  # A failed `audit` does not fail the deploy - it makes every job after it
  # `skipped`, which in the UI reads as "nothing to do here" rather than "we
  # did not ship". On 2026-09-15 twenty-two merges landed on testnet while the
  # deployed image stayed on a commit from two days earlier, and no job
  # anywhere was red for the deploy. This job is.
  testnet-deploy-status:
    name: Testnet deploy status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [audit, build, docker, notify-deploy-testnet, deploy-verify-testnet]
    if: always() && github.ref == 'refs/heads/testnet'
    permissions: {}
    steps:
      - name: Fail if testnet did not deploy this commit
        run: |
          audit="${{ needs['audit'].result }}"
          build="${{ needs['build'].result }}"
          image="${{ needs['docker'].result }}"
          dispatch="${{ needs['notify-deploy-testnet'].result }}"
          verify="${{ needs['deploy-verify-testnet'].result }}"

          printf 'audit=%s build=%s docker=%s dispatch=%s verify=%s\n' \
            "$audit" "$build" "$image" "$dispatch" "$verify"

          if [ "$verify" = "success" ]; then
            echo "testnet is serving ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Name the first link that broke rather than the last, so the message
          # points at the cause and not at the skip it produced.
          for pair in "audit:$audit" "build:$build" "docker:$image" \
                      "dispatch:$dispatch" "verify:$verify"; do
            stage="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" != "success" ]; then
              echo "::error::testnet did NOT deploy ${GITHUB_SHA::7} - '$stage' was '$result'. The branch has moved; the running image has not."
              exit 1
            fi
          done
          exit 1
