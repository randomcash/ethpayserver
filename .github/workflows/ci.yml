name: CI

on:
  pull_request:
  push:
    branches: [main, testnet]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone payserver-commons (sibling)
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          cd ..
          git clone --depth 1 -b "$BRANCH" https://github.com/randomcash/payserver-commons.git 2>/dev/null \
            || git clone --depth 1 https://github.com/randomcash/payserver-commons.git
          echo "Cloned payserver-commons"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ethpayserver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Clone payserver-commons (sibling)
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          cd ..
          git clone --depth 1 -b "$BRANCH" https://github.com/randomcash/payserver-commons.git 2>/dev/null \
            || git clone --depth 1 https://github.com/randomcash/payserver-commons.git

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install mold + nextest
        run: |
          sudo apt-get update && sudo apt-get install -y mold
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Unit tests
        run: cargo nextest run --workspace --lib --no-fail-fast -j 2

      - name: Integration tests
        run: |
          DATABASE_URL="postgres://test:test@127.0.0.1:5432/ethpayserver_test" \
            cargo run --release --bin migrate_postgres
          DATABASE_URL="postgres://test:test@127.0.0.1:5432/ethpayserver_test" \
            cargo nextest run -p data-service --no-fail-fast --run-ignored only -j 1 \
            || echo "WARNING: integration tests had failures (non-blocking)"
        continue-on-error: true

  audit:
    name: Audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet'
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check licenses sources
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet'
    steps:
      - uses: actions/checkout@v4

      - name: Clone payserver-commons (sibling)
        run: |
          BRANCH="${{ github.ref_name }}"
          cd ..
          git clone --depth 1 -b "$BRANCH" https://github.com/randomcash/payserver-commons.git 2>/dev/null \
            || git clone --depth 1 https://github.com/randomcash/payserver-commons.git

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-release

      - name: Install mold + trunk
        run: |
          sudo apt-get update && sudo apt-get install -y mold
          cargo install trunk --locked

      - name: Build server
        run: |
          cargo build --release --bin ethpayserver
          cargo build --release --bin migrate_postgres

      - name: Build monitor
        run: cargo build --release --bin evmmonitor --features monitor-bin

      - name: Build client
        run: cd client && trunk build --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            target/release/ethpayserver
            target/release/migrate_postgres
            target/release/evmmonitor
            client/dist/
          retention-days: 1

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ethpayserver_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Make binaries executable
        run: chmod +x target/release/ethpayserver target/release/migrate_postgres

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run migrations
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/ethpayserver_e2e
        run: ./target/release/migrate_postgres

      - name: Start server
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/ethpayserver_e2e
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          ./target/release/ethpayserver &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/health/live && break || sleep 1; done

      - name: Serve frontend
        run: |
          npx -y serve -s client/dist -l 8080 &
          sleep 2

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_API_URL: http://127.0.0.1:3000
          E2E_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
    continue-on-error: true

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push server
        run: |
          docker build -f docker/ethpayserver.Dockerfile \
            -t ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.tag }} .
          docker push ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.tag }}

      - name: Build & push monitor
        run: |
          docker build -f docker/evmmonitor.Dockerfile \
            -t ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.tag }} .
          docker push ${{ env.IMAGE_BASE }}/evmmonitor:${{ steps.tag.outputs.tag }}

      - name: Build & push client
        run: |
          docker build -f docker/client.Dockerfile \
            -t ${{ env.IMAGE_BASE }}/client:${{ steps.tag.outputs.tag }} .
          docker push ${{ env.IMAGE_BASE }}/client:${{ steps.tag.outputs.tag }}

  notify-deploy:
    name: Notify Deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/testnet' || github.ref == 'refs/heads/main'
    steps:
      - name: Trigger central-infrastructure deploy
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DEPLOY_PAT" \
            https://api.github.com/repos/randomcash/central-infrastructure/dispatches \
            -d '{"event_type": "deploy", "client_payload": {"service": "ethpayserver", "environment": "${{ github.ref_name }}", "sha": "${{ github.sha }}", "tag": "${{ github.ref_name }}-latest"}}'
