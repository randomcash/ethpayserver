# Where does the nightly's synthetic payment spend from?
#
# The address is derived from E2E_TEST_MNEMONIC, so it changes when that secret
# changes and cannot be looked up anywhere. Deriving it locally needs node plus
# an EC library and keccak, which the cockpit account has none of - so it is
# done here, where the toolchain already exists, and the answer is an address
# rather than anything secret.
#
# Run this after changing E2E_TEST_MNEMONIC to find out which address to fund.
name: E2E wallet address

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  address:
    name: Where to send SepoliaETH
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Derive
        working-directory: e2e
        env:
          E2E_TEST_MNEMONIC: ${{ secrets.E2E_TEST_MNEMONIC }}
        run: |
          node -e '
            const { HDKey, mnemonicToAccount } = require("viem/accounts");
            const { mnemonicToSeedSync } = require("@scure/bip39");
            const m = process.env.E2E_TEST_MNEMONIC;
            if (!m) { console.error("E2E_TEST_MNEMONIC is not set"); process.exit(1); }
            const xpub = HDKey.fromMasterSeed(mnemonicToSeedSync(m)).derive('m/44\'/60\'/0\'').publicExtendedKey;
            const spender = mnemonicToAccount(m, { accountIndex: 9 }).address;
            console.log("");
            console.log("receive xpub (registered by the spec):", xpub);
            console.log("FUND THIS ADDRESS with SepoliaETH   :", spender);
            console.log("");
            console.log("about 0.002 per nightly run; send a few weeks worth.");
          '
