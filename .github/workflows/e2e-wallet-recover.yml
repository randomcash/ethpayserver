name: Recover the E2E wallet

# One-shot, hand-triggered: empty the synthetic-payment wallet to an address
# someone actually holds a key for.
#
# It exists because the phrase behind that wallet lives in exactly one place -
# the `E2E_TEST_MNEMONIC` secret - and was never written down anywhere else.
# It was generated by a script that was never committed, printed to a terminal,
# and read back out of a tmux scrollback that has since been lost. So the
# balance cannot be moved from anyone's laptop; the only process that can still
# sign for it is this one.
#
# Which is also the reason the job is worth keeping rather than deleting after
# it runs: the same situation reaches the same wall next time, and a rotation
# always needs the old wallet emptied before the secret is replaced.
#
# Dry run unless `execute` is typed. `--scan` defaults high on purpose: the
# derivation counter never restarts, so a range that stops short reports
# "nothing to sweep" and looks exactly like success.

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Address to send everything to (exact EIP-55 casing)"
        required: true
        type: string
      scan:
        description: "How many derived addresses to walk"
        required: false
        default: "1000"
        type: string
      confirm:
        description: "Type `execute` to broadcast. Anything else is a dry run."
        required: false
        default: "dry-run"
        type: string

# No write scope. This job reads a secret and talks to an RPC; it has no
# business with the repository's contents, and a token that can change them is
# scope it never uses.
permissions: {}

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      # Separate from the run below so the destination is echoed into the log
      # before anything can move, and so a malformed one fails here rather than
      # after the mnemonic is in memory.
      - name: Echo what was asked for
        env:
          DESTINATION: ${{ inputs.destination }}
          SCAN: ${{ inputs.scan }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          echo "destination: $DESTINATION"
          echo "scan:        $SCAN"
          if [ "$CONFIRM" = "execute" ]; then
            echo "mode:        EXECUTE - this broadcasts"
          else
            echo "mode:        dry run"
          fi

      - name: Sweep
        working-directory: e2e
        env:
          E2E_TEST_MNEMONIC: ${{ secrets.E2E_TEST_MNEMONIC }}
          E2E_SEPOLIA_RPC_URL: ${{ secrets.E2E_SEPOLIA_RPC_URL }}
          DESTINATION: ${{ inputs.destination }}
          SCAN: ${{ inputs.scan }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ -n "$E2E_TEST_MNEMONIC" ] || { echo "::error::E2E_TEST_MNEMONIC is not set"; exit 1; }

          # Every input reaches the script through the environment. An Actions
          # expression in a `run` block is substituted before bash is started,
          # so one interpolated into the command line would be shell rather
          # than an argument.
          #
          # That substitution also happens inside what looks like a shell
          # comment, which is how the first version of this file failed to
          # parse: a comment here explaining the rule contained an empty
          # expression, and GitHub tried to evaluate it. Refer to the syntax
          # in prose, never by writing it.
          FLAG=""
          if [ "$CONFIRM" = "execute" ]; then
            FLAG="--execute"
          fi

          node scripts/sweep-test-wallet.mjs \
            --to "$DESTINATION" \
            --scan "$SCAN" $FLAG
