stages:
  - check
  - test
  - security
  - build

# Shell executor — runs on host, uses native cargo cache.
# No Docker overhead, no image pulls, no dep recompilation.

variables:
  CARGO_INCREMENTAL: "1"

# Clone payserver-commons if not already present (for [patch] paths)
before_script:
  - |
    if [ ! -d "../payserver-commons" ]; then
      git clone --depth 1 https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/random.cash/payserver-commons.git ../payserver-commons
    else
      cd ../payserver-commons && git pull --ff-only && cd -
    fi

# ---------------------------------------------------------------------------
# Stage: check (single job — fmt + clippy in one compilation pass)
# ---------------------------------------------------------------------------

lint:
  stage: check
  script:
    - cargo fmt -p server -p data-service -p evm -p ethpayserver-client -- --check
    - cargo clippy -p server -p data-service -p evm -p ethpayserver-client --all-targets -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Stage: test
# ---------------------------------------------------------------------------

test:
  stage: test
  script:
    - cargo test --workspace --lib --no-fail-fast
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

test:doc:
  stage: test
  script:
    - cargo doc --workspace --no-deps
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Stage: security (tools pre-installed on runner — no compile overhead)
# ---------------------------------------------------------------------------

audit:
  stage: security
  script:
    - cargo audit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

deny:
  stage: security
  script:
    - cargo deny check licenses sources
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# ---------------------------------------------------------------------------
# Stage: build
# ---------------------------------------------------------------------------

build:release:
  stage: build
  script:
    - cargo build --release --bin ethpayserver
    - cargo build --release --bin migrate_postgres
  artifacts:
    paths:
      - target/release/ethpayserver
      - target/release/migrate_postgres
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:check:
  stage: build
  script:
    - cargo build --release --bin ethpayserver
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
