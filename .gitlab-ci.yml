stages:
  - lint
  - check
  - build
  - e2e
  - docker
  - notify

# Shell executor — runs on host, uses native cargo cache.

variables:
  CARGO_BUILD_JOBS: "2"
  # sccache — compile cache persisted via runner volume mount
  RUSTC_WRAPPER: "/usr/local/bin/sccache"
  SCCACHE_DIR: "/sccache"
  SCCACHE_CACHE_SIZE: "20G"
  # mold linker — ~10× faster than default ld for Rust binaries
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  SERVER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  SERVER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH-latest
  MONITOR_IMAGE: $CI_REGISTRY_IMAGE/evmmonitor:$CI_COMMIT_SHORT_SHA
  MONITOR_IMAGE_LATEST: $CI_REGISTRY_IMAGE/evmmonitor:$CI_COMMIT_BRANCH-latest
  CLIENT_IMAGE: $CI_REGISTRY_IMAGE/client:$CI_COMMIT_SHORT_SHA
  CLIENT_IMAGE_LATEST: $CI_REGISTRY_IMAGE/client:$CI_COMMIT_BRANCH-latest

# Ensure rustfmt + clippy are available (not shipped with rust:*-bookworm)
# and clone payserver-commons, trying the MR source branch first.
before_script:
  - rustup component add rustfmt clippy
  - |
    COMMONS_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/random.cash/payserver-commons.git"
    BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-${CI_COMMIT_BRANCH:-main}}"
    if [ ! -d "../payserver-commons" ]; then
      git clone --depth 1 -b "$BRANCH" "$COMMONS_URL" ../payserver-commons 2>/dev/null \
        || git clone --depth 1 "$COMMONS_URL" ../payserver-commons
    else
      cd ../payserver-commons && git pull --ff-only && cd -
    fi
  - sccache --start-server 2>/dev/null || true

# ---------------------------------------------------------------------------
# Stage: lint — fast checks that gate everything else (fmt + clippy)
# ---------------------------------------------------------------------------

lint:
  stage: lint
  resource_group: rust-compile
  script:
    - cargo fmt -p server -p data-service -p evm -p ethpayserver-client -- --check
    - cargo clippy -p server -p data-service -p evm -p ethpayserver-client --all-targets -- -D warnings
    - sccache --show-stats || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

# ---------------------------------------------------------------------------
# Stage: check — test + audit (need: lint, skip on docs-only MRs)
# ---------------------------------------------------------------------------

test:
  stage: check
  needs: ["lint"]
  resource_group: rust-compile
  script:
    # Unit tests
    - cargo nextest run --workspace --lib --no-fail-fast -j 1
    # Integration tests against ephemeral Postgres (requires Docker socket)
    - |
      if ! docker info >/dev/null 2>&1; then
        echo "WARNING: Docker not available, skipping integration tests"
        exit 0
      fi
      PGCONTAINER="ci_postgres_${CI_JOB_ID}"
      docker rm -f $PGCONTAINER 2>/dev/null || true
      docker run -d --name $PGCONTAINER -p 0:5432 \
        -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=ethpayserver_test \
        postgres:16-alpine
      PGPORT=$(docker port $PGCONTAINER 5432 | head -1 | cut -d: -f2)
      cleanup() { docker rm -f $PGCONTAINER 2>/dev/null; }
      trap cleanup EXIT
      for i in $(seq 1 30); do
        docker exec $PGCONTAINER pg_isready -U test && break || sleep 1
      done
      DATABASE_URL="postgres://test:test@127.0.0.1:$PGPORT/ethpayserver_test" \
        cargo run --release --bin migrate_postgres
      DATABASE_URL="postgres://test:test@127.0.0.1:$PGPORT/ethpayserver_test" \
        cargo nextest run -p data-service --no-fail-fast --run-ignored only -j 1 || echo "WARNING: integration tests failed (known FK fixture issues, non-blocking)"
    - sccache --show-stats || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.rs"
        - "**/*.sql"
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

audit:
  stage: check
  needs: ["lint"]
  script:
    # Re-use binaries from previous runs when the volume cache preserves them;
    # otherwise install. sccache accelerates the compile path when a cold
    # install is required.
    - |
      if ! command -v cargo-audit >/dev/null 2>&1; then
        cargo install cargo-audit --locked
      fi
      if ! command -v cargo-deny >/dev/null 2>&1; then
        cargo install cargo-deny --locked
      fi
    # Use persistent advisory-db mount from the runner volume
    - |
      git config --global --unset-all url."ssh://git@github.com/".insteadOf || true
      if [ -d /cargo-advisory-db/.git ]; then
        echo "Refreshing cached advisory-db"
        git -C /cargo-advisory-db fetch --quiet --depth 1 origin master 2>/dev/null || true
        git -C /cargo-advisory-db reset --hard origin/master 2>/dev/null || true
      else
        echo "Cloning advisory-db to cache"
        git clone --depth 1 https://github.com/RustSec/advisory-db.git /cargo-advisory-db
      fi
      mkdir -p ${CARGO_HOME:-$HOME/.cargo}
      ln -sfn /cargo-advisory-db ${CARGO_HOME:-$HOME/.cargo}/advisory-db
    - cargo audit --no-fetch
    - cargo deny check licenses sources
  timeout: 10 minutes
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "deny.toml"
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

# ---------------------------------------------------------------------------
# Stage: build — compile binaries and WASM on host (parallel)
# ---------------------------------------------------------------------------

build:server:
  stage: build
  needs: ["lint"]
  resource_group: rust-compile
  script:
    - cargo build --release --bin ethpayserver
    - cargo build --release --bin migrate_postgres
    - sccache --show-stats || true
  artifacts:
    paths:
      - target/release/ethpayserver
      - target/release/migrate_postgres
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

build:monitor:
  stage: build
  needs: ["lint"]
  resource_group: rust-compile
  script:
    - cargo build --release --bin evmmonitor --features monitor-bin
    - sccache --show-stats || true
  artifacts:
    paths:
      - target/release/evmmonitor
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

build:client:
  stage: build
  needs: ["lint"]
  script:
    - cd client && trunk build --release
  artifacts:
    paths:
      - client/dist/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

build:check:
  stage: build
  needs: ["lint"]
  resource_group: rust-compile
  script:
    - cargo build --release --bin ethpayserver
    - sccache --show-stats || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.rs"
        - "**/*.sql"
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - .gitlab-ci.yml

# ---------------------------------------------------------------------------
# Stage: e2e — Playwright regression tests against live backend + frontend
# ---------------------------------------------------------------------------

e2e:
  stage: e2e
  needs:
    - build:server
    - build:client
  variables:
    E2E_API_URL: "http://127.0.0.1:3000"
    E2E_BASE_URL: "http://127.0.0.1:8080"
  script:
    # Start Postgres
    - |
      PGCONTAINER="ci_e2e_postgres_${CI_JOB_ID}"
      docker rm -f $PGCONTAINER 2>/dev/null || true
      docker run -d --name $PGCONTAINER -p 0:5432 \
        -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=ethpayserver_e2e \
        postgres:16-alpine
      PGPORT=$(docker port $PGCONTAINER 5432 | head -1 | cut -d: -f2)
      cleanup_pg() { docker rm -f $PGCONTAINER 2>/dev/null; }
      trap cleanup_pg EXIT
    # Start Redis
    - |
      REDISCONTAINER="ci_e2e_redis_${CI_JOB_ID}"
      docker rm -f $REDISCONTAINER 2>/dev/null || true
      docker run -d --name $REDISCONTAINER -p 0:6379 redis:7-alpine
      REDISPORT=$(docker port $REDISCONTAINER 6379 | head -1 | cut -d: -f2)
      cleanup_all() { docker rm -f $PGCONTAINER $REDISCONTAINER 2>/dev/null; }
      trap cleanup_all EXIT
    # Wait for Postgres
    - |
      for i in $(seq 1 30); do
        docker exec $PGCONTAINER pg_isready -U test && break || sleep 1
      done
    # Run migrations and start backend with dynamic ports
    - export DATABASE_URL="postgres://test:test@127.0.0.1:$PGPORT/ethpayserver_e2e"
    - export REDIS_URL="redis://127.0.0.1:$REDISPORT"
    - ./target/release/migrate_postgres
    - ./target/release/ethpayserver &
    - |
      for i in $(seq 1 30); do
        curl -sf ${E2E_API_URL}/health/live && break || sleep 1
      done
    # Serve frontend from pre-built client dist
    - npx -y serve -s client/dist -l 8080 &
    - sleep 2
    # Install Playwright and run tests
    - cd e2e && npm ci && npx playwright install --with-deps chromium
    - npx playwright test
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"
  allow_failure: true

# ---------------------------------------------------------------------------
# Stage: docker — package pre-built binaries into slim images (parallel)
# ---------------------------------------------------------------------------

docker:server:
  stage: docker
  needs:
    - build:server
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker build
      -f docker/ethpayserver.Dockerfile
      -t $SERVER_IMAGE
      -t $SERVER_IMAGE_LATEST
      .
    - docker push $SERVER_IMAGE
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push $SERVER_IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

docker:monitor:
  stage: docker
  needs:
    - build:monitor
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker build
      -f docker/evmmonitor.Dockerfile
      -t $MONITOR_IMAGE
      -t $MONITOR_IMAGE_LATEST
      .
    - docker push $MONITOR_IMAGE
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push $MONITOR_IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

docker:client:
  stage: docker
  needs:
    - build:client
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker build
      -f docker/client.Dockerfile
      -t $CLIENT_IMAGE
      -t $CLIENT_IMAGE_LATEST
      .
    - docker push $CLIENT_IMAGE
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push $CLIENT_IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

# ---------------------------------------------------------------------------
# Stage: notify — trigger downstream deploy (if configured)
# ---------------------------------------------------------------------------

notify:deploy:
  stage: notify
  before_script: []
  script:
    - |
      if [ -n "$DEPLOY_TRIGGER_URL" ]; then
        curl -s -X POST -F "token=$DEPLOY_TRIGGER_TOKEN" -F "ref=main" "$DEPLOY_TRIGGER_URL"
      else
        echo "DEPLOY_TRIGGER_URL not set, skipping"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "testnet"
    - if: $CI_COMMIT_BRANCH == "main"
