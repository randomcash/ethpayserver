stages:
  - verify
  - build
  - e2e
  - audit
  - docker
  - notify
  - mutation

default:
  timeout: 3 hours
  # Custom runner image. Rustfmt, clippy, wasm32 target, mold, sccache,
  # cargo-nextest, cargo-audit, cargo-deny, and trunk are all baked in.
  # See openclaw-config/picoclaw/ci-base/Dockerfile.
  image: registry.gitlab.com/random.cash/payserver-commons/ci-base:rust-1.94

# Docker executor. The runner image
# (registry.gitlab.com/random.cash/payserver-commons/ci-base:rust-1.94) ships rustfmt, clippy,
# cargo-nextest, cargo-audit, cargo-deny, mold, sccache, and trunk. See
# openclaw-config/picoclaw/ci-base/ for the Dockerfile that builds it.

variables:
  CARGO_BUILD_JOBS: "4"
  RUSTC_WRAPPER: "/usr/local/bin/sccache"
  SCCACHE_DIR: "/sccache"
  SCCACHE_CACHE_SIZE: "20G"
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  SERVER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  SERVER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH-latest
  MONITOR_IMAGE: $CI_REGISTRY_IMAGE/evmmonitor:$CI_COMMIT_SHORT_SHA
  MONITOR_IMAGE_LATEST: $CI_REGISTRY_IMAGE/evmmonitor:$CI_COMMIT_BRANCH-latest
  CLIENT_IMAGE: $CI_REGISTRY_IMAGE/client:$CI_COMMIT_SHORT_SHA
  CLIENT_IMAGE_LATEST: $CI_REGISTRY_IMAGE/client:$CI_COMMIT_BRANCH-latest

# Clone payserver-commons next to this repo, trying the MR source branch first.
# sccache is started here so every job can reuse the running daemon.
before_script:
  - |
    COMMONS_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/random.cash/payserver-commons.git"
    BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-${CI_COMMIT_BRANCH:-main}}"
    rm -rf ../payserver-commons || true
    if git clone --depth 1 -b "$BRANCH" "$COMMONS_URL" ../payserver-commons 2>/dev/null; then
      echo "Cloned payserver-commons branch: $BRANCH"
    else
      echo "Branch $BRANCH not found in payserver-commons, using main"
      git clone --depth 1 "$COMMONS_URL" ../payserver-commons
    fi
  - sccache --start-server 2>/dev/null || true

# ---------------------------------------------------------------------------
# verify — fmt + clippy + lib unit tests. Runs on every MR; intentionally
# light. Postgres integration, coverage, and release-build sanity all live
# in verify:coverage (testnet/main only).
# ---------------------------------------------------------------------------

verify:
  stage: verify
  script:
    - cargo fmt -p server -p data-service -p evm -p ethpayserver-client -- --check
    - cargo clippy -p server -p data-service -p evm -p ethpayserver-client --all-targets -- -D warnings
    - cargo nextest run --workspace --lib --no-fail-fast
    - sccache --show-stats || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

# ---------------------------------------------------------------------------
# verify:coverage — RCS-110 coverage gate + postgres integration tests.
# Heavy: llvm-cov instruments everything so it can't reuse target/debug
# from `verify`. Restricted to integration branches so MRs stay fast.
# Release-mode binary sanity is already exercised by the build:* jobs.
# ---------------------------------------------------------------------------

verify:coverage:
  stage: verify
  services:
    # Postgres as a GitLab CI service sibling container; resolved via hostname.
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: ethpayserver_test
    DATABASE_URL: "postgres://test:test@postgres:5432/ethpayserver_test"
  script:
    - rustup component add llvm-tools 2>/dev/null || true
    - command -v cargo-llvm-cov >/dev/null 2>&1 || cargo install cargo-llvm-cov --locked
    # Wait for the postgres service container to accept TCP, then migrate.
    - |
      for i in $(seq 1 30); do
        if timeout 2 bash -c '</dev/tcp/postgres/5432' 2>/dev/null; then
          echo "postgres ready after ${i}s"
          break
        fi
        sleep 1
      done
    - cargo run --bin migrate_postgres
    - |
      cargo nextest run -p data-service --no-fail-fast --run-ignored only \
        || echo "WARNING: integration tests failed (known FK fixture issues, non-blocking)"
    - RUSTC_WRAPPER="" cargo llvm-cov nextest --workspace --lib --no-fail-fast --fail-under-lines 25 --cobertura --output-path cobertura.xml
    - sccache --show-stats || true
  artifacts:
    when: always
    paths:
      - cobertura.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
  coverage: '/TOTAL\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+(\d+\.\d+)%/'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

# ---------------------------------------------------------------------------
# build:* — produce release binary artifacts on integration branches only.
# Skipped on MRs; verify already cargo-check'd the same entry points.
# ---------------------------------------------------------------------------

build:server:
  stage: build
  needs: ["verify"]
  script:
    - cargo build --release --bin ethpayserver
    - cargo build --release --bin migrate_postgres
    - sccache --show-stats || true
  artifacts:
    paths:
      - target/release/ethpayserver
      - target/release/migrate_postgres
      - target/release/ethpay-mcp
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

build:monitor:
  stage: build
  needs: ["verify"]
  script:
    - cargo build --release --bin evmmonitor --features monitor-bin
    - sccache --show-stats || true
  artifacts:
    paths:
      - target/release/evmmonitor
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

build:client:
  stage: build
  needs: ["verify"]
  script:
    - cd client && trunk build --release
  artifacts:
    paths:
      - client/dist/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

# ---------------------------------------------------------------------------
# e2e — Playwright regression against live backend + frontend.
# ---------------------------------------------------------------------------

e2e:
  stage: e2e
  needs:
    - build:server
    - build:client
  # Postgres and Redis run as service sibling containers; the previous
  # `docker run -p 0:5432` pattern silently broke under DinD because the
  # random host port was bound on the daemon, unreachable from the job.
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    E2E_API_URL: "http://127.0.0.1:3000"
    E2E_BASE_URL: "http://127.0.0.1:8080"
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: ethpayserver_e2e
    DATABASE_URL: "postgres://test:test@postgres:5432/ethpayserver_e2e"
    REDIS_URL: "redis://redis:6379"
  script:
    - |
      for i in $(seq 1 30); do
        if timeout 2 bash -c '</dev/tcp/postgres/5432' 2>/dev/null; then
          echo "postgres ready after ${i}s"
          break
        fi
        sleep 1
      done
    - ./target/release/migrate_postgres
    - ./target/release/ethpayserver &
    - |
      for i in $(seq 1 30); do
        curl -sf ${E2E_API_URL}/health/live && break || sleep 1
      done
    - npx -y serve -s client/dist -l 8080 &
    - sleep 2
    - cd e2e && npm ci && npx playwright install --with-deps chromium
    - npx playwright test
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
      - e2e/perf-results.json
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"
  allow_failure: true

# ---------------------------------------------------------------------------
# audit — cargo-audit + cargo-deny. Only runs on testnet/main since it's
# advisory-level, never a merge blocker. Binaries ship with the runner image;
# the advisory DB is refreshed from a persistent volume mount.
# ---------------------------------------------------------------------------

audit:
  stage: audit
  # Runs in parallel with the build stage — no Rust compilation happens here.
  needs: []
  script:
    - |
      git config --global --unset-all url."ssh://git@github.com/".insteadOf || true
      if [ -d /cargo-advisory-db/.git ]; then
        echo "Refreshing cached advisory-db"
        git -C /cargo-advisory-db fetch --quiet --depth 1 origin master 2>/dev/null || true
        git -C /cargo-advisory-db reset --hard origin/master 2>/dev/null || true
      else
        echo "Cloning advisory-db to cache"
        git clone --depth 1 https://github.com/RustSec/advisory-db.git /cargo-advisory-db
      fi
      mkdir -p ${CARGO_HOME:-$HOME/.cargo}
      ln -sfn /cargo-advisory-db ${CARGO_HOME:-$HOME/.cargo}/advisory-db
    - cargo audit --no-fetch
    - cargo deny check licenses sources
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "testnet"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# docker — package pre-built binaries into slim images.
# ---------------------------------------------------------------------------

docker:server:
  stage: docker
  needs:
    - build:server
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker build
      -f docker/ethpayserver.Dockerfile
      -t $SERVER_IMAGE
      -t $SERVER_IMAGE_LATEST
      .
    - docker push $SERVER_IMAGE
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push $SERVER_IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

docker:monitor:
  stage: docker
  needs:
    - build:monitor
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker build
      -f docker/evmmonitor.Dockerfile
      -t $MONITOR_IMAGE
      -t $MONITOR_IMAGE_LATEST
      .
    - docker push $MONITOR_IMAGE
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push $MONITOR_IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

docker:client:
  stage: docker
  needs:
    - build:client
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker build
      -f docker/client.Dockerfile
      -t $CLIENT_IMAGE
      -t $CLIENT_IMAGE_LATEST
      .
    - docker push $CLIENT_IMAGE
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push $CLIENT_IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "testnet"

# ---------------------------------------------------------------------------
# notify — trigger downstream deploy (if configured)
# ---------------------------------------------------------------------------

notify:deploy:
  stage: notify
  before_script: []
  script:
    - |
      if [ -n "$DEPLOY_TRIGGER_URL" ]; then
        curl -s -X POST -F "token=$DEPLOY_TRIGGER_TOKEN" -F "ref=main" "$DEPLOY_TRIGGER_URL"
      else
        echo "DEPLOY_TRIGGER_URL not set, skipping"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "testnet"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# mutation — weekly cargo-mutants safety net on money-path code (RCS-111).
# Runs ONLY on scheduled pipelines (configure: Sunday 03:00 UTC, ref: testnet).
# Each file gets its own parallel job. Surviving mutants are filed as Linear
# issues tagged "test-gap". Does NOT fail the pipeline — informational only.
# ---------------------------------------------------------------------------

.mutation:
  stage: mutation
  needs: []
  timeout: 6 hours
  before_script:
    - |
      COMMONS_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/random.cash/payserver-commons.git"
      BRANCH="${CI_COMMIT_BRANCH:-testnet}"
      rm -rf ../payserver-commons || true
      if git clone --depth 1 -b "$BRANCH" "$COMMONS_URL" ../payserver-commons 2>/dev/null; then
        echo "Cloned payserver-commons branch: $BRANCH"
      else
        git clone --depth 1 "$COMMONS_URL" ../payserver-commons
      fi
    - sccache --start-server 2>/dev/null || true
    - cargo install cargo-mutants --locked
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
  artifacts:
    when: always
    paths:
      - mutants.out/
    expire_in: 14 days

mutation:test:
  extends: .mutation
  parallel:
    matrix:
      - MUTANT_FILE:
          - server/src/api/invoices.rs
          - server/src/api/payouts.rs
          - server/src/api/refunds.rs
          - server/src/services/event_consumer.rs
          - server/src/services/webhook.rs
          - evm/src/wallet.rs
          - evm/src/monitor/chain.rs
          - evm/src/monitor/coordinator.rs
          - evm/src/monitor/events.rs
          - evm/src/monitor/handlers.rs
  script:
    - cargo mutants --file "$MUTANT_FILE" -- --workspace --lib --no-fail-fast || true
    - bash scripts/report-surviving-mutants.sh mutants.out
    - sccache --show-stats || true
