[package]
name = "data-service"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Data access layer for PayServer"

[features]
default = ["postgres"]
postgres = ["dep:sqlx"]
redis = ["dep:redis"]
test-utils = []

[dependencies]
types = { git = "ssh://git@gitlab.com/random.cash/payserver-commons.git" }
auth = { git = "ssh://git@gitlab.com/random.cash/payserver-commons.git" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"], optional = true }
tokio = { version = "1.42", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "macros"] }
crypto = { git = "ssh://git@gitlab.com/random.cash/payserver-commons.git" }
