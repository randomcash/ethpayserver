[workspace]
members = ["server", "data-service", "evm", "mcp-server", "loadtest"]
resolver = "3"

[workspace.package]

# The one place payserver-commons is pinned.
#
# `rev` is what makes a build reproducible: with the old sibling-path `[patch]`
# the lock file recorded no commons revision at all, so which code you got was
# decided by CI shell logic and by whatever `main` happened to be that minute.
# Rebuilding last week's commit silently picked up this week's commons, and a
# breaking change to a shared crate broke `testnet` the moment it merged
# (RCS-215 did exactly that on 2026-09-06).
#
# To work against a local commons checkout, do NOT edit this. Run
# `scripts/commons.sh link`, which writes an uncommitted `.cargo/config.toml`
# patch. To move the pin, `scripts/commons.sh pin <rev>`.
[workspace.dependencies]
api-types = { git = "https://github.com/randomcash/payserver-commons.git", rev = "5e5dc9539fb8a3eddc8b87cc0e32b2aa5dd888ba" }
scrub = { git = "https://github.com/randomcash/payserver-commons.git", rev = "5e5dc9539fb8a3eddc8b87cc0e32b2aa5dd888ba" }
types = { git = "https://github.com/randomcash/payserver-commons.git", rev = "5e5dc9539fb8a3eddc8b87cc0e32b2aa5dd888ba" }
auth = { git = "https://github.com/randomcash/payserver-commons.git", rev = "5e5dc9539fb8a3eddc8b87cc0e32b2aa5dd888ba" }
crypto = { git = "https://github.com/randomcash/payserver-commons.git", rev = "5e5dc9539fb8a3eddc8b87cc0e32b2aa5dd888ba" }
rates = { git = "https://github.com/randomcash/payserver-commons.git", rev = "5e5dc9539fb8a3eddc8b87cc0e32b2aa5dd888ba" }
