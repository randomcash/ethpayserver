[workspace]
members = ["server", "data-service", "evm", "client", "mcp-server", "loadtest"]
resolver = "3"

[workspace.package]

# The one place payserver-commons is pinned.
#
# `rev` is what makes a build reproducible: with the old sibling-path `[patch]`
# the lock file recorded no commons revision at all, so which code you got was
# decided by CI shell logic and by whatever `main` happened to be that minute.
# Rebuilding last week's commit silently picked up this week's commons, and a
# breaking change to a shared crate broke `testnet` the moment it merged
# (RCS-215 did exactly that on 2026-09-06).
#
# To work against a local commons checkout, do NOT edit this. Run
# `scripts/commons.sh link`, which writes an uncommitted `.cargo/config.toml`
# patch. To move the pin, `scripts/commons.sh pin <rev>`.
[workspace.dependencies]
api-types = { git = "https://github.com/randomcash/payserver-commons.git", rev = "4300f2e564e1f3a5eeeb3c10f9f384cfe2f5f5c1" }
types = { git = "https://github.com/randomcash/payserver-commons.git", rev = "4300f2e564e1f3a5eeeb3c10f9f384cfe2f5f5c1" }
auth = { git = "https://github.com/randomcash/payserver-commons.git", rev = "4300f2e564e1f3a5eeeb3c10f9f384cfe2f5f5c1" }
crypto = { git = "https://github.com/randomcash/payserver-commons.git", rev = "4300f2e564e1f3a5eeeb3c10f9f384cfe2f5f5c1" }
rates = { git = "https://github.com/randomcash/payserver-commons.git", rev = "4300f2e564e1f3a5eeeb3c10f9f384cfe2f5f5c1" }
ui-kit = { git = "https://github.com/randomcash/payserver-commons.git", rev = "4300f2e564e1f3a5eeeb3c10f9f384cfe2f5f5c1" }

# Size-optimize the WASM client only. Scoped to this package (not a
# workspace-wide `[profile.release]`) so the server / monitor / migrate
# binaries keep their runtime-optimized release builds. wasm-opt -Oz runs on
# top of this via the trunk `data-wasm-opt="z"` flag in client/index.html.
[profile.release.package.ethpayserver-client]
opt-level = "z"
