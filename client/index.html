<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVM PayServer</title>
    <link data-trunk rel="css" href="styles.css">
</head>
<body>
    <div id="app">
        <style>
            .wasm-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#f7f8fa;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
            .wasm-spinner{width:36px;height:36px;border:3px solid #e3e8ee;border-top-color:#635bff;border-radius:50%;animation:spin .7s linear infinite}
            .wasm-loading-text{margin-top:16px;color:#697386;font-size:14px;font-weight:500}
            @keyframes spin{to{transform:rotate(360deg)}}
        </style>
        <div class="wasm-loading">
            <div class="wasm-spinner"></div>
            <div class="wasm-loading-text">Loading&hellip;</div>
        </div>
    </div>
    <link data-trunk rel="rust" data-target-name="ethpayserver_client" data-wasm-opt="z" />
</body>
</html>
