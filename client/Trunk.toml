[build]
target = "index.html"
dist = "dist"
no_sri = true

[watch]
ignore = ["dist"]

[serve]
address = "127.0.0.1"
port = 8080
open = false

# Proxy API requests to the backend server
[[proxy]]
rewrite = "/api/"
backend = "http://127.0.0.1:3000/"

[[hooks]]
stage = "build"
command = "sh"
command_arguments = ["-c", "echo 'Building EVM PayServer client...'"]

# Pre-compress WASM and JS assets for faster delivery
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "for f in dist/*.wasm dist/*.js dist/*.css; do [ -f \"$f\" ] && gzip -9 -k -f \"$f\"; done"]

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "for f in dist/*.wasm dist/*.js dist/*.css; do [ -f \"$f\" ] && brotli -9 -k -f \"$f\" 2>/dev/null; done"]
