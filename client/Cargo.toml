[package]
name = "ethpayserver-client"
version = "0.1.0"
edition = "2024"
description = "Web frontend for ethpayserver"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ethpayserver-client"
path = "src/main.rs"

[dependencies]
# Shared UI components
ui-kit = { path = "../../payserver-commons/ui-kit", features = ["auth"] }
types = { path = "../../payserver-commons/types" }

# Leptos framework
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"

# WASM interop
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Navigator",
    "Clipboard",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "console",
    "WebSocket",
    "MessageEvent",
    "Event",
    "CloseEvent",
    "ErrorEvent",
    "EventTarget",
    "PromiseRejectionEvent",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
gloo-net = "0.6"
gloo-timers = "0.3"

# Utilities
thiserror = "2.0"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"

# WASM-specific: enable JS random source
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.0", features = ["v4", "js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Native tests only (`evm` pulls in alloy/sqlx and does not build for wasm32).
# Used by the scrubber parity test in src/telemetry/scrub.rs; dev-dependencies
# are never built into the WASM bundle.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
evm = { path = "../evm", features = ["sentry-scrub"] }

[features]
default = ["standalone"]
standalone = []
