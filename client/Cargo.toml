[package]
name = "ethpayserver-client"
version = "0.1.0"
edition = "2024"
description = "Web frontend for ethpayserver"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ethpayserver-client"
path = "src/main.rs"

[dependencies]
# Shared UI components
ui-kit = { workspace = true, features = ["auth"] }
# `clock`/`wasmbind` for `Utc::now()` in the browser; nothing else. Default
# features pull more into a bundle this workspace deliberately keeps small.
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "wasmbind"] }
api-types = { workspace = true }
types = { workspace = true }
# Secret/PII redaction, shared with the payservers. Zero dependencies and
# hand-written scanners rather than regexes: `regex` costs ~1 MB of WASM.
scrub = { workspace = true }

# Leptos framework
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"

# WASM interop
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Navigator",
    "Clipboard",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "console",
    "WebSocket",
    "MessageEvent",
    "Event",
    "CloseEvent",
    "ErrorEvent",
    "EventTarget",
    "PromiseRejectionEvent",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
gloo-net = "0.6"
gloo-timers = "0.3"

# Utilities
thiserror = "2.0"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"

# WASM-specific: enable JS random source
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.0", features = ["v4", "js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["standalone"]
standalone = []
