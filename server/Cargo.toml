[package]
name = "server"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Main server for ethpayserver - unified API and service orchestration"
license = "MIT"

[[bin]]
name = "ethpayserver"
path = "src/bin/server.rs"

[[bin]]
name = "migrate_postgres"
path = "src/bin/migrate_postgres.rs"

[dependencies]
# Internal crates
auth = { git = "https://gitlab.com/random.cash/payserver-commons.git", features = ["metrics", "captcha"] }
crypto = { git = "https://gitlab.com/random.cash/payserver-commons.git" }
data-service = { path = "../data-service" }
evm = { path = "../evm", features = ["api", "redis"] }
rates = { git = "https://gitlab.com/random.cash/payserver-commons.git" }
types = { git = "https://gitlab.com/random.cash/payserver-commons.git", features = ["openapi"] }

# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
dotenvy = "0.15"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error monitoring
sentry = { version = "0.47", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "reqwest", "rustls"] }
sentry-tracing = "0.47"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Rate limiting
governor = "0.10"

# Ethereum primitives
alloy-primitives = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
rust_decimal = "1.36"
url = "2"

# Webhook delivery
reqwest = { version = "0.12", features = ["json"] }
redis = { version = "0.27", features = ["tokio-comp"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"

# Database migrations
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate"] }

[dev-dependencies]
tokio = { version = "1.42", features = ["test-util"] }
tokio-tungstenite = "0.28"
data-service = { path = "../data-service", features = ["test-utils"] }
evm = { path = "../evm", features = ["api", "redis", "test-utils"] }

# Clippy lints — catches panics on user-input paths at compile time.
# `unwrap` / `expect` are allowed only in tests and in explicit initialisation
# paths annotated with #[allow(clippy::unwrap_used)].
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
