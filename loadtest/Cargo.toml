[package]
name = "loadtest"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "loadtest"
path = "src/main.rs"

[[bin]]
name = "loadtest-ws"
path = "src/ws_main.rs"

[dependencies]
goose = "0.18"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
types = { git = "https://github.com/randomcash/payserver-commons.git" }
