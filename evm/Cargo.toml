[package]
name = "evm"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "EVM blockchain interaction layer for ethpayserver"
license = "MIT"

[features]
default = []
api = ["axum", "utoipa", "types", "data-service", "auth"]

[dependencies]
# Ethereum/EVM - alloy ecosystem
alloy = { version = "1.0", features = [
    "providers",
    "provider-http",
    "provider-ws",
    "pubsub",
    "network",
    "contract",
    "rpc-types",
    "signers",
    "signer-local",
] }

# HD wallet derivation
coins-bip32 = "0.13"
coins-bip39 = "0.13"
k256 = "0.13"

# Async runtime
tokio = { version = "1.42", features = ["sync", "time"] }
tokio-stream = "0.1"
async-trait = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
hex = "0.4"
rand = "0.9"
uuid = { version = "1.11", features = ["v4", "serde"] }

# API (optional)
axum = { version = "0.8", optional = true }
utoipa = { version = "5", features = ["axum_extras"], optional = true }
types = { git = "ssh://git@gitlab.com/random.cash/payserver-commons.git", optional = true }
data-service = { path = "../data-service", optional = true }
auth = { git = "ssh://git@gitlab.com/random.cash/payserver-commons.git", optional = true }

[dev-dependencies]
tokio = { version = "1.42", features = ["full", "test-util"] }
