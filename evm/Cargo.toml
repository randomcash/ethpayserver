[package]
name = "evm"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "EVM blockchain interaction layer for ethpayserver"
license = "MIT"

[[bin]]
name = "evmmonitor"
path = "src/bin/evmmonitor.rs"
required-features = ["monitor-bin"]

[features]
default = []
api = ["axum", "utoipa", "types", "data-service", "auth"]
redis = ["dep:redis"]
test-utils = []
monitor-bin = ["redis", "types", "data-service", "data-service/redis", "dep:toml", "dep:tracing-subscriber", "dep:dotenvy", "dep:clap", "dep:anyhow", "tokio/full"]

[dependencies]
# Ethereum/EVM - alloy ecosystem
alloy = { version = "1.0", features = [
    "providers",
    "provider-http",
    "provider-ws",
    "pubsub",
    "network",
    "contract",
    "rpc-types",
    "signers",
    "signer-local",
    "rand",
] }

# HD wallet derivation
coins-bip32 = "0.13"
coins-bip39 = "0.13"
k256 = "0.13"

# Async runtime
tokio = { version = "1.42", features = ["sync", "time"] }
tokio-stream = "0.1"
async-trait = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
hex = "0.4"
rand = "0.9"
uuid = { version = "1.11", features = ["v4", "serde"] }

# Event bridge - Redis (optional)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }

# Binary dependencies (optional)
toml = { version = "0.8", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
dotenvy = { version = "0.15", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
anyhow = { version = "1.0", optional = true }

# API (optional)
axum = { version = "0.8", optional = true }
utoipa = { version = "5", features = ["axum_extras"], optional = true }
types = { git = "https://gitlab.com/random.cash/payserver-commons.git", optional = true }
data-service = { path = "../data-service", optional = true }
auth = { git = "https://gitlab.com/random.cash/payserver-commons.git", optional = true }

[lints.clippy]
too_many_lines = { level = "deny", priority = -1 }
cognitive_complexity = "deny"

[dev-dependencies]
tokio = { version = "1.42", features = ["full", "test-util"] }
