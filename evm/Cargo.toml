[package]
name = "evm"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "EVM blockchain interaction layer for ethpayserver"
license = "MIT"

[dependencies]
# Ethereum/EVM - alloy ecosystem
alloy = { version = "1.0", features = [
    "providers",
    "provider-http",
    "provider-ws",
    "network",
    "contract",
    "rpc-types",
    "signers",
    "signer-local",
] }

# HD wallet derivation
coins-bip32 = "0.13"
coins-bip39 = "0.13"
k256 = "0.13"

# Async runtime
tokio = { version = "1.42", features = ["sync", "time"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
hex = "0.4"
rand = "0.9"

[dev-dependencies]
tokio = { version = "1.42", features = ["full", "test-util"] }
